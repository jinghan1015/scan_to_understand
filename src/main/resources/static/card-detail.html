<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡片详情</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: white;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }
        .glow-orbs {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        .floating-item {
            position: absolute;
            font-size: 24px;
            animation: floatItem 8s ease-in-out infinite;
            opacity: 0.6;
        }
        
        .floating-item:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; font-size: 20px; }
        .floating-item:nth-child(2) { top: 25%; right: 15%; animation-delay: -1s; font-size: 28px; }
        .floating-item:nth-child(3) { top: 60%; left: 20%; animation-delay: -2s; font-size: 22px; }
        .floating-item:nth-child(4) { top: 70%; right: 10%; animation-delay: -3s; font-size: 26px; }
        .floating-item:nth-child(5) { top: 40%; left: 5%; animation-delay: -4s; font-size: 24px; }
        .floating-item:nth-child(6) { top: 85%; right: 25%; animation-delay: -5s; font-size: 20px; }
        
        @keyframes floatItem {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.6; }
            25% { transform: translateY(-20px) rotate(15deg) scale(1.1); opacity: 0.8; }
            50% { transform: translateY(-10px) rotate(-10deg) scale(1.2); opacity: 0.9; }
            75% { transform: translateY(-25px) rotate(5deg) scale(1.1); opacity: 0.7; }
        }
        .app-container { position: relative; z-index: 2; min-height: 100vh; padding-bottom: 40px; }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; background: linear-gradient(135deg, rgba(147,197,253,0.8) 0%, rgba(191,219,254,0.9) 100%);
            backdrop-filter: blur(20px); border-bottom: 1px solid rgba(59,130,246,0.1);
            position: sticky; top: 0; z-index: 50;
        }
        .back-btn {
            width: 40px; height: 40px; background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #1e3a8a; font-size: 18px; cursor: pointer; transition: all 0.3s ease;
        }
        .back-btn:hover { background: rgba(96, 165, 250, 0.2); border-color: rgba(96, 165, 250, 0.4); }
        .header-title { font-size: 18px; font-weight: 600; color: #1e3a8a; letter-spacing: 2px; }
        .content { padding: 20px 15px; }
        .card-hero {
            background: linear-gradient(135deg, rgba(147,197,253,0.2) 0%, rgba(191,219,254,0.3) 100%); border: 1px solid rgba(59,130,246,0.2);
            border-radius: 24px; padding: 25px; margin-bottom: 20px;
        }
        .card-badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
            background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3);
            border-radius: 20px; color: #3b82f6; font-size: 11px; letter-spacing: 1px; margin-bottom: 15px;
        }
        .card-badge::before { content: ''; width: 6px; height: 6px; background: #3b82f6; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
        .card-title { font-size: 24px; font-weight: 700; color: #1f2937; margin-bottom: 15px; line-height: 1.3; letter-spacing: 1px; }
        .card-meta { display: flex; align-items: center; gap: 15px; padding-top: 12px; border-top: 1px solid rgba(59,130,246,0.1); }
        .meta-item { display: flex; align-items: center; gap: 6px; color: #6b7280; font-size: 12px; }
        .meta-item span { color: #3b82f6; }
        .section-block {
            background: linear-gradient(135deg, rgba(147,197,253,0.2) 0%, rgba(191,219,254,0.3) 100%); border: 1px solid rgba(59,130,246,0.2);
            border-radius: 20px; padding: 20px; margin-bottom: 15px;
        }
        .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .section-icon {
            width: 36px; height: 36px; background: linear-gradient(135deg, rgba(96, 165, 250, 0.2), rgba(124, 58, 237, 0.2));
            border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .section-title { font-size: 15px; font-weight: 600; color: #1e3a8a; letter-spacing: 1px; }
        .text-content { color: #374151; font-size: 15px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
        .images-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .image-item { aspect-ratio: 1; background: rgba(255,255,255,0.8); border-radius: 12px; overflow: hidden; border: 1px solid rgba(59,130,246,0.15); }
        .image-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .image-item:hover img { transform: scale(1.05); }
        .image-item.single { grid-column: span 2; aspect-ratio: 16/9; }
        .media-wrapper { background: rgba(255,255,255,0.8); border-radius: 16px; overflow: hidden; border: 1px solid rgba(59,130,246,0.15); }
        .media-wrapper video, .media-wrapper audio { width: 100%; display: block; }
        .media-wrapper audio { height: 60px; }
        .loading-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .loading-spinner { width: 60px; height: 60px; border: 3px solid rgba(59,130,246,0.15); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: #6b7280; font-size: 14px; letter-spacing: 2px; }
        .empty-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 40px; }
        .empty-icon { width: 100px; height: 100px; background: linear-gradient(135deg, rgba(147,197,253,0.2) 0%, rgba(191,219,254,0.3) 100%); border: 1px dashed rgba(59,130,246,0.2); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .empty-text { color: #6b7280; font-size: 16px; }
    </style>
</head>

<body>
    <div class="grid-overlay"></div>
    <div class="glow-orbs">
        <div class="floating-item">✨</div>
        <div class="floating-item">🌸</div>
        <div class="floating-item">⭐</div>
        <div class="floating-item">🌼</div>
        <div class="floating-item">✨</div>
        <div class="floating-item">🌺</div>
    </div>

    <div id="app" class="app-container">
        <div class="header">
            <div class="back-btn" @click="goBack">←</div>
            <div class="header-title">卡片详情</div>
            <div style="width:40px;"></div>
        </div>

        <div v-if="loading" class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">加载中...</div>
        </div>

        <div v-else-if="!card" class="empty-container">
            <div class="empty-icon">📭</div>
            <div class="empty-text">卡片不存在</div>
        </div>

        <div v-else class="content">
            <div class="card-hero">
                <div class="card-badge">DIGITAL CARD</div>
                <h1 class="card-title">{{ card.title }}</h1>
                <div class="card-meta">
                    <div class="meta-item">🕐 <span>实时更新</span></div>
                    <div class="meta-item">🔒 <span>安全存储</span></div>
                </div>
            </div>

            <div v-if="card.textContent" class="section-block">
                <div class="section-header">
                    <div class="section-icon">📝</div>
                    <div class="section-title">文字内容</div>
                </div>
                <div class="text-content">{{ card.textContent }}</div>
            </div>

            <div v-if="images && images.length" class="section-block">
                <div class="section-header">
                    <div class="section-icon">🖼️</div>
                    <div class="section-title">图片集</div>
                </div>
                <div class="images-grid">
                    <div class="image-item" :class="{ single: images.length === 1 }" v-for="(img, idx) in images" :key="idx">
                        <img :src="img.startsWith('http') ? img : BASE_URL + img" @click="previewImage(idx)" />
                    </div>
                </div>
            </div>

            <div v-if="card.videoUrl" class="section-block">
                <div class="section-header">
                    <div class="section-icon">🎬</div>
                    <div class="section-title">视频内容</div>
                </div>
                <div class="media-wrapper">
                    <video controls :src="card.videoUrl.startsWith('http') ? card.videoUrl : BASE_URL + card.videoUrl"></video>
                </div>
            </div>

            <div v-if="card.audioUrl" class="section-block">
                <div class="section-header">
                    <div class="section-icon">🎙️</div>
                    <div class="section-title">语音介绍</div>
                </div>
                <div class="media-wrapper">
                    <audio controls :src="card.audioUrl.startsWith('http') ? card.audioUrl : BASE_URL + card.audioUrl"></audio>
                </div>
            </div>
        </div>
    </div>

    <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
    <script src="common.js"></script>
    <script>
        const { createApp, ref, onMounted } = Vue;
        const app = createApp({
            setup() {
                const card = ref(null);
                const images = ref([]);
                const loading = ref(true);
                const urlParams = new URLSearchParams(window.location.search);
                const uuid = urlParams.get('uuid');

                onMounted(async () => {
                    if (!uuid) { loading.value = false; return; }
                    try {
                        await fetch(`${BASE_URL}/card/view?cardUuid=${uuid}`, {
                            method: 'POST'
                        });
                        
                        const res = await fetch(`${BASE_URL}/card/detail/${uuid}`);
                        const data = await res.json();
                        if (data.code === 200) {
                            card.value = data.data;
                            if (data.data.imageUrls) {
                                images.value = JSON.parse(data.data.imageUrls);
                            }
                            // 检测是否是链接，如果是则自动跳转
                            if (data.data.textContent) {
                                const content = data.data.textContent.trim();
                                try {
                                    new URL(content);
                                    // 是有效链接，自动跳转
                                    vant.showToast({ type: 'success', message: '正在跳转到链接...' });
                                    setTimeout(() => {
                                        window.location.href = content;
                                    }, 800);
                                } catch (e) {
                                    // 不是链接，正常显示
                                }
                            }
                        }
                    } catch (e) { console.error(e); }
                    finally { loading.value = false; }
                });

                const previewImage = (index) => {
                    const fullUrls = images.value.map(img => img.startsWith('http') ? img : BASE_URL + img);
                    vant.showImagePreview({
                        images: fullUrls,
                        startIndex: index
                    });
                };

                const goBack = () => {
                    const userId = localStorage.getItem('userId');
                    if (!userId) {
                        location.href = 'login.html';
                        return;
                    }
                    const params = new URLSearchParams(window.location.search);
                    const from = params.get('from');
                    if (from === 'mine') {
                        location.href = 'mine.html';
                    } else if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        location.href = 'index.html';
                    }
                };

                return { card, images, loading, BACKEND_URL, previewImage, goBack };
            }
        });
        app.use(vant);
        app.mount('#app');
    </script>
</body>

</html>
