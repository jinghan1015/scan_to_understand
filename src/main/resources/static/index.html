<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>码上明晓</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 50%, #f0f9ff 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }

        #particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        box-shadow 0.3s ease,
                        opacity 0.3s ease;
        }

        .particle:hover {
            transform: scale(1.15);
        }

        .particle.popping {
            animation: popOut 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes popOut {
            0% { transform: scale(1); }
            30% { transform: scale(1.4); }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes floatReverse {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(-5deg); }
        }

        @keyframes gentleSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .app-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            padding-bottom: 120px;
        }

        .hero-section {
            padding: 80px 30px 50px;
            text-align: center;
        }

        .hero-badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 30px;
            color: #0891b2;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.1);
        }

        .hero-logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 40px;
            position: relative;
            animation: gentleSpin 20s linear infinite;
        }

        .hero-logo::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top-color: #06b6d4;
            border-right-color: #06b6d4;
            border-radius: 50%;
            animation: gentleSpin 8s linear infinite reverse;
        }

        .hero-logo::after {
            content: '';
            position: absolute;
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border: 3px solid transparent;
            border-bottom-color: #8b5cf6;
            border-left-color: #8b5cf6;
            border-radius: 50%;
            animation: gentleSpin 6s linear infinite;
        }

        .hero-logo-inner {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 25%;
            left: 25%;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(6, 182, 212, 0.3);
        }

        .hero-logo-inner::before {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid white;
            transform: rotate(45deg);
        }

        .hero-title {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #0891b2 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            letter-spacing: 6px;
        }

        .hero-subtitle {
            color: #64748b;
            font-size: 16px;
            letter-spacing: 4px;
            font-weight: 300;
        }

        .features-section {
            padding: 40px 30px;
        }

        .features-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            max-width: 800px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 24px 20px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            min-width: 100px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .feature-item:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 20px 40px rgba(6, 182, 212, 0.15);
            border-color: rgba(6, 182, 212, 0.3);
        }

        .feature-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(139, 92, 246, 0.1));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .feature-title {
            color: #334155;
            font-size: 14px;
            font-weight: 600;
        }

        .action-section {
            padding: 50px 30px;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .action-btn {
            flex: 1;
            padding: 20px 36px;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-create {
            background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
            color: white;
            box-shadow: 0 10px 40px rgba(6, 182, 212, 0.35);
        }

        .btn-scan {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(6, 182, 212, 0.3);
            color: #0891b2;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .btn-create:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 20px 50px rgba(6, 182, 212, 0.45);
        }

        .btn-scan:hover {
            transform: translateY(-4px) scale(1.02);
            background: white;
            border-color: #06b6d4;
            box-shadow: 0 20px 50px rgba(6, 182, 212, 0.2);
        }

        .btn-create::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s ease;
        }

        .btn-create:hover::before {
            left: 100%;
        }

        .action-btn .icon {
            font-size: 20px;
        }

        .tabbar-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .custom-tabbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 16px 30px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(6, 182, 212, 0.1);
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.05);
        }

        .tabbar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            padding: 8px 20px;
            border-radius: 16px;
        }

        .tabbar-item:hover {
            background: rgba(6, 182, 212, 0.08);
        }

        .tabbar-item.active {
            color: #06b6d4;
        }

        .tabbar-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .tabbar-text {
            font-size: 12px;
            letter-spacing: 1px;
        }

        .click-hint {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 30px;
            color: #64748b;
            font-size: 13px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            animation: bounce 2s ease-in-out infinite;
            z-index: 50;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        .click-hint.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
    </style>
</head>

<body>
    <div id="particles-container"></div>
    
    <div class="click-hint" id="clickHint">✨ 点击漂浮的气泡试试</div>

    <div id="app" class="app-container">
        <div class="hero-section">
            <div class="hero-badge">✨ SMART DIGITAL CARD</div>
            <div class="hero-logo">
                <div class="hero-logo-inner"></div>
            </div>
            <h1 class="hero-title">码上明晓</h1>
            <p class="hero-subtitle">数字化名片 · 扫码即达</p>
        </div>

        <div class="features-section">
            <div class="features-row">
                <div class="feature-item">
                    <div class="feature-icon">🖼️</div>
                    <div class="feature-title">图片</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🎬</div>
                    <div class="feature-title">视频</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🎙️</div>
                    <div class="feature-title">语音</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📲</div>
                    <div class="feature-title">二维码</div>
                </div>
            </div>
        </div>

        <div class="action-section">
            <div class="action-buttons">
                <button class="action-btn btn-create" @click="createCard">
                    <span class="icon">+</span>新建卡片
                </button>
                <button class="action-btn btn-scan" @click="scanQR">
                    <span class="icon">📷</span>扫码
                </button>
            </div>
        </div>

        <div class="tabbar-wrapper">
            <div class="custom-tabbar">
                <div class="tabbar-item active">
                    <div class="tabbar-icon">⬡</div>
                    <span class="tabbar-text">首页</span>
                </div>
                <div class="tabbar-item" @click="goToMine">
                    <div class="tabbar-icon">⧉</div>
                    <span class="tabbar-text">我的</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
    <script src="common.js"></script>

    <script>
        const { createApp } = Vue;

        const app = createApp({
            setup() {
                const createCard = () => {
                    window.location.href = 'create-card.html';
                };
                const scanQR = () => {
                    window.location.href = 'scan.html';
                };
                const goToMine = () => {
                    window.location.href = 'mine.html';
                };
                const userId = localStorage.getItem('userId');
                if (!userId) {
                    window.location.href = 'login.html';
                }
                return { createCard, scanQR, goToMine };
            }
        });

        app.use(vant);
        app.mount('#app');

        const particles = [];
        const container = document.getElementById('particles-container');
        const clickHint = document.getElementById('clickHint');
        let hintHidden = false;

        const colors = [
            { bg: 'rgba(6, 182, 212, 0.15)', border: 'rgba(6, 182, 212, 0.4)' },
            { bg: 'rgba(139, 92, 246, 0.12)', border: 'rgba(139, 92, 246, 0.35)' },
            { bg: 'rgba(236, 72, 153, 0.1)', border: 'rgba(236, 72, 153, 0.3)' },
            { bg: 'rgba(34, 197, 94, 0.1)', border: 'rgba(34, 197, 94, 0.3)' },
            { bg: 'rgba(251, 191, 36, 0.12)', border: 'rgba(251, 191, 36, 0.35)' },
            { bg: 'rgba(99, 102, 241, 0.1)', border: 'rgba(99, 102, 241, 0.3)' },
            { bg: 'rgba(14, 165, 233, 0.12)', border: 'rgba(14, 165, 233, 0.35)' },
            { bg: 'rgba(168, 85, 247, 0.1)', border: 'rgba(168, 85, 247, 0.3)' },
        ];

        const emojis = ['🌸', '✨', '💫', '🌺', '💎', '🎀', '🌟', '🦋', '🌈', '☁️', '🍃', '💧'];

        class Particle {
            constructor() {
                this.element = document.createElement('div');
                this.element.className = 'particle';
                this.size = Math.random() * 50 + 30;
                this.x = Math.random() * (window.innerWidth - this.size);
                this.y = Math.random() * (window.innerHeight - this.size);
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 2;
                this.bobOffset = Math.random() * Math.PI * 2;
                this.bobSpeed = Math.random() * 0.02 + 0.01;
                this.colorSet = colors[Math.floor(Math.random() * colors.length)];
                this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
                this.isPopping = false;

                this.init();
            }

            init() {
                this.element.style.width = `${this.size}px`;
                this.element.style.height = `${this.size}px`;
                this.element.style.left = `${this.x}px`;
                this.element.style.top = `${this.y}px`;
                this.element.style.background = this.colorSet.bg;
                this.element.style.border = `2px solid ${this.colorSet.border}`;
                this.element.style.boxShadow = `0 8px 32px ${this.colorSet.border}`;
                this.element.innerHTML = `<span style="font-size: ${this.size * 0.4}px; display: flex; align-items: center; justify-content: center; height: 100%;">${this.emoji}</span>`;

                const floatAnim = Math.random() > 0.5 ? 'float' : 'floatReverse';
                this.element.style.animation = `${floatAnim} ${6 + Math.random() * 4}s ease-in-out infinite`;
                this.element.style.animationDelay = `${Math.random() * 2}s`;

                this.element.addEventListener('click', (e) => this.handleClick(e));
                this.element.addEventListener('mousemove', (e) => this.handleHover(e));

                container.appendChild(this.element);
            }

            handleClick(e) {
                if (this.isPopping) return;
                this.isPopping = true;
                this.element.classList.add('popping');

                if (!hintHidden) {
                    hintHidden = true;
                    clickHint.classList.add('hidden');
                }

                setTimeout(() => {
                    this.respawn();
                }, 600);
            }

            handleHover(e) {
                if (this.isPopping) return;
                const rect = this.element.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const dx = e.clientX - centerX;
                const dy = e.clientY - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < this.size * 1.5) {
                    const force = (this.size * 1.5 - dist) / (this.size * 1.5) * 0.5;
                    this.vx += (dx / dist) * force;
                    this.vy += (dy / dist) * force;
                }
            }

            respawn() {
                const side = Math.floor(Math.random() * 4);
                switch (side) {
                    case 0: // top
                        this.x = Math.random() * window.innerWidth;
                        this.y = -this.size;
                        break;
                    case 1: // right
                        this.x = window.innerWidth + this.size;
                        this.y = Math.random() * window.innerHeight;
                        break;
                    case 2: // bottom
                        this.x = Math.random() * window.innerWidth;
                        this.y = window.innerHeight + this.size;
                        break;
                    case 3: // left
                        this.x = -this.size;
                        this.y = Math.random() * window.innerHeight;
                        break;
                }

                this.size = Math.random() * 50 + 30;
                this.colorSet = colors[Math.floor(Math.random() * colors.length)];
                this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
                this.vx = (Math.random() - 0.5) * 1;
                this.vy = (Math.random() - 0.5) * 1;
                this.rotation = Math.random() * 360;
                this.isPopping = false;

                this.element.style.width = `${this.size}px`;
                this.element.style.height = `${this.size}px`;
                this.element.style.background = this.colorSet.bg;
                this.element.style.border = `2px solid ${this.colorSet.border}`;
                this.element.style.boxShadow = `0 8px 32px ${this.colorSet.border}`;
                this.element.innerHTML = `<span style="font-size: ${this.size * 0.4}px; display: flex; align-items: center; justify-content: center; height: 100%;">${this.emoji}</span>`;
                this.element.classList.remove('popping');

                this.updatePosition();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.99;
                this.vy *= 0.99;

                if (this.vx > 2) this.vx = 2;
                if (this.vx < -2) this.vx = -2;
                if (this.vy > 2) this.vy = 2;
                if (this.vy < -2) this.vy = -2;

                if (this.x < -this.size * 2) this.x = window.innerWidth + this.size;
                if (this.x > window.innerWidth + this.size) this.x = -this.size * 2;
                if (this.y < -this.size * 2) this.y = window.innerHeight + this.size;
                if (this.y > window.innerHeight + this.size) this.y = -this.size * 2;

                this.rotation += this.rotationSpeed;
            }

            updatePosition() {
                this.element.style.left = `${this.x}px`;
                this.element.style.top = `${this.y}px`;
                this.element.style.transform = `rotate(${this.rotation}deg)`;
            }

            draw() {
                this.update();
                this.updatePosition();
            }
        }

        function initParticles() {
            const particleCount = Math.min(20, Math.floor(window.innerWidth / 80));
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            for (const particle of particles) {
                particle.draw();
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            if (particles.length < Math.min(20, Math.floor(window.innerWidth / 80))) {
                particles.push(new Particle());
            }
        });

        initParticles();
        animate();

        setTimeout(() => {
            if (!hintHidden) {
                clickHint.style.opacity = '0';
                setTimeout(() => clickHint.classList.add('hidden'), 500);
                hintHidden = true;
            }
        }, 8000);
    </script>
</body>

</html>
