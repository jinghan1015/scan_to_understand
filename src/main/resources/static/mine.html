<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的卡片</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0f0f1a 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            animation: float 10s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #00d4ff 0%, transparent 70%);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
            bottom: -80px;
            right: -80px;
            animation-delay: -5s;
        }

        @keyframes float {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(20px, -20px) scale(1.05);
            }
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 25px;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: rgba(255, 100, 100, 0.15);
            border: 1px solid rgba(255, 100, 100, 0.3);
            border-radius: 8px;
            color: #ff6464;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 100, 100, 0.25);
            border-color: rgba(255, 100, 100, 0.5);
        }

        .user-info {
            padding: 30px 25px 20px;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        .user-stats {
            display: flex;
            gap: 20px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .stat-item span {
            color: #00d4ff;
            font-weight: 600;
        }

        .cards-section {
            padding: 25px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: linear-gradient(180deg, #00d4ff, #7c3aed);
            border-radius: 2px;
        }

        .cards-count {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            color: #00d4ff;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card-item:hover {
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
        }

        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.5;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card-btn {
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .card-btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.7);
        }

        .card-btn-outline:hover {
            border-color: rgba(0, 212, 255, 0.5);
            color: #00d4ff;
        }

        .card-btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.2);
        }

        .card-btn-primary:hover {
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
        }

        .card-btn-danger {
            background: rgba(255, 100, 100, 0.15);
            border: 1px solid rgba(255, 100, 100, 0.3);
            color: #ff6464;
        }

        .card-btn-danger:hover {
            background: rgba(255, 100, 100, 0.25);
            border-color: rgba(255, 100, 100, 0.5);
        }

        .empty-state {
            text-align: center;
            padding: 60px 30px;
        }

        .empty-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 25px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .empty-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
            margin-bottom: 25px;
        }

        .empty-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
            transition: all 0.3s ease;
        }

        .empty-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.4);
        }

        .loading-state {
            text-align: center;
            padding: 80px 30px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .qr-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .qr-modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .qr-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .qr-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .qr-close {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .qr-close:hover {
            background: rgba(255, 100, 100, 0.2);
            color: #ff6464;
        }

        .qr-body {
            padding: 25px;
            text-align: center;
        }

        .qr-image-wrapper {
            background: white;
            padding: 15px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .qr-image {
            width: 200px;
            height: 200px;
            display: block;
        }

        .qr-tip {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .qr-share-section {
            text-align: left;
            margin-bottom: 20px;
        }

        .qr-link-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .qr-link-box {
            display: flex;
            gap: 10px;
        }

        .qr-link-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 15px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            outline: none;
        }

        .copy-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .save-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .tabbar-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .custom-tabbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 15px 30px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tabbar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .tabbar-item.active {
            color: #00d4ff;
        }

        .tabbar-icon {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .tabbar-text {
            font-size: 11px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="grid-bg"></div>

    <div id="app" class="app-container">
        <div class="header">
            <div class="back-btn" @click="goBack">←</div>
            <div class="header-title">我的卡片</div>
            <div class="logout-btn" @click="logout">退出</div>
        </div>

        <div class="user-info">
            <div class="user-card">
                <div class="avatar">👤</div>
                <div class="user-details">
                    <div class="user-name">{{ nickname || '用户' }}</div>
                    <div class="user-stats">
                        <div class="stat-item">
                            <span>{{ cards.length }}</span> 张卡片
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="cards-section">
            <div class="section-header">
                <div class="section-title">卡片列表</div>
                <div class="cards-count">{{ cards.length }} 个</div>
            </div>

            <div v-if="loading" class="loading-state">
                <div class="loading-spinner"></div>
                <div class="loading-text">加载中...</div>
            </div>

            <div v-else-if="cards.length === 0" class="empty-state">
                <div class="empty-icon">📋</div>
                <div class="empty-text">还没有创建任何卡片</div>
                <a href="create-card.html" class="empty-btn">创建第一张卡片</a>
            </div>

            <div v-else class="cards-list">
                <div class="card-item" v-for="card in cards" :key="card.id">
                    <div class="card-header">
                        <div class="card-info">
                            <div class="card-title">{{ card.title }}</div>
                            <div class="card-desc">{{ card.textContent }}</div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="card-btn card-btn-outline" @click.stop="showQR(card)">二维码</button>
                        <button class="card-btn card-btn-primary" @click.stop="openDetail(card)">查看</button>
                        <button class="card-btn card-btn-danger" @click.stop="deleteCard(card)">删除</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="tabbar-wrapper">
            <div class="custom-tabbar">
                <div class="tabbar-item" @click="goToHome">
                    <div class="tabbar-icon">⬡</div>
                    <span class="tabbar-text">首页</span>
                </div>
                <div class="tabbar-item active">
                    <div class="tabbar-icon">⧉</div>
                    <span class="tabbar-text">我的</span>
                </div>
            </div>
        </div>

        <div class="qr-modal" v-if="showQRModal">
            <div class="qr-modal-content">
                <div class="qr-header">
                    <span class="qr-title">名片二维码</span>
                    <span class="qr-close" @click="closeQRModal">×</span>
                </div>
                <div class="qr-body">
                    <div class="qr-image-wrapper">
                        <img :src="currentQRUrl" alt="二维码" class="qr-image" />
                    </div>
                    <div class="qr-tip">微信扫码查看名片</div>
                    <div class="qr-share-section">
                        <div class="qr-link-label">分享链接</div>
                        <div class="qr-link-box">
                            <input type="text" :value="currentShareUrl" readonly class="qr-link-input" />
                            <button class="copy-btn" @click="copyShareUrl">复制</button>
                        </div>
                    </div>
                    <button class="save-btn" @click="saveQRCode">保存二维码图片</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
    <script src="common.js"></script>
    <script>
        const { createApp, ref, onMounted } = Vue;

        const app = createApp({
            setup() {
                const cards = ref([]);
                const loading = ref(true);
                const nickname = ref(localStorage.getItem('nickname') || '');
                const showQRModal = ref(false);
                const currentQRUrl = ref('');
                const currentShareUrl = ref('');
                const currentCard = ref(null);

                const userId = localStorage.getItem('userId');
                if (!userId) { location.href = 'login.html'; }

                const fetchCards = async () => {
                    loading.value = true;
                    try {
                        const res = await fetch(`${BASE_URL}/api/card/my?userId=${userId}`);
                        const data = await res.json();
                        if (data.code === 200) {
                            cards.value = data.data;
                        }
                    } catch (e) { console.error(e); }
                    finally { loading.value = false; }
                };

                onMounted(fetchCards);

                const openDetail = (card) => {
                    window.open(`card-detail.html?uuid=${card.uuid}`, '_blank');
                };

                const showQR = (card) => {
                    if (card.qrCodeUrl) {
                        currentCard.value = card;
                        const qrUrl = card.qrCodeUrl.startsWith('http') ? card.qrCodeUrl : BACKEND_URL + card.qrCodeUrl;
                        currentQRUrl.value = qrUrl;
                        currentShareUrl.value = `${NGROK_URL}/card-detail.html?uuid=${card.uuid}`;
                        showQRModal.value = true;
                    } else {
                        alert('二维码未生成');
                    }
                };

                const closeQRModal = () => {
                    showQRModal.value = false;
                    currentCard.value = null;
                    currentQRUrl.value = '';
                    currentShareUrl.value = '';
                };

                const copyShareUrl = async () => {
                    try {
                        await navigator.clipboard.writeText(currentShareUrl.value);
                        alert('链接已复制');
                    } catch (e) {
                        alert('复制失败');
                    }
                };

                const saveQRCode = () => {
                    const link = document.createElement('a');
                    link.href = currentQRUrl.value;
                    link.download = `qrcode_${currentCard.value?.title || 'card'}.png`;
                    link.click();
                };

                const deleteCard = async (card) => {
                    if (!confirm('确定要删除这个名片吗？')) return;
                    try {
                        const res = await fetch(`${BASE_URL}/api/card/${card.uuid}`, {
                            method: 'DELETE'
                        });
                        const data = await res.json();
                        if (data.code === 200) {
                            alert('删除成功');
                            fetchCards();
                        } else {
                            alert(data.msg || '删除失败');
                        }
                    } catch (e) {
                        alert('网络错误');
                    }
                };

                const goBack = () => { history.back(); };
                const goToHome = () => { location.href = 'index.html'; };
                const logout = () => {
                    localStorage.removeItem('userId');
                    localStorage.removeItem('nickname');
                    location.href = 'login.html';
                };

                return { cards, loading, nickname, NGROK_URL, showQRModal, currentQRUrl, currentShareUrl, openDetail, showQR, closeQRModal, copyShareUrl, saveQRCode, deleteCard, goBack, goToHome, logout };
            }
        });
        app.use(vant);
        app.mount('#app');
    </script>
</body>

</html>
