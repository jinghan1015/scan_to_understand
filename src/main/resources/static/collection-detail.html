<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合集详情</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(135deg, rgba(168,85,247,0.1) 0%, rgba(147,197,253,0.2) 100%); font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        
        .page-container { max-width: 420px; margin: 0 auto; min-height: 100vh; background: #fff; position: relative; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 20px 25px; background: linear-gradient(135deg, #a855f7, #60a5fa); color: #fff; }
        .back-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
        .header-title { font-size: 18px; font-weight: 600; }
        
        .collection-info { padding: 25px; background: linear-gradient(135deg, rgba(168,85,247,0.15) 0%, rgba(147,197,253,0.2) 100%); }
        .collection-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #a855f7, #60a5fa); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; margin-bottom: 15px; }
        .collection-name { font-size: 22px; font-weight: 600; color: #1f2937; margin-bottom: 8px; }
        .collection-meta { display: flex; gap: 20px; color: #6b7280; font-size: 13px; }
        .meta-item { display: flex; align-items: center; gap: 5px; }
        
        .cards-section { padding: 20px; }
        .section-title { font-size: 16px; font-weight: 600; color: #1f2937; margin-bottom: 15px; }
        
        .cards-list { display: flex; flex-direction: column; gap: 12px; }
        .card-item { background: #fff; border: 1px solid rgba(168,85,247,0.2); border-radius: 16px; overflow: hidden; padding: 15px; }
        .card-header { display: flex; gap: 12px; }
        .card-thumbnail { width: 55px; height: 55px; background: linear-gradient(135deg, rgba(168,85,247,0.2) 0%, rgba(147,197,253,0.3) 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .card-thumbnail img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
        .card-content { flex: 1; min-width: 0; }
        .card-title { font-size: 15px; font-weight: 600; color: #1f2937; margin-bottom: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-desc { font-size: 12px; color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { font-size: 60px; margin-bottom: 15px; opacity: 0.5; }
        .empty-text { color: #6b7280; font-size: 14px; }
        
        .loading-overlay { display: flex; justify-content: center; align-items: center; padding: 50px; }
        .loading-spinner { width: 40px; height: 40px; border: 4px solid #f3f4f6; border-top: 4px solid #a855f7; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app" class="page-container">
        <div class="header">
            <div class="back-btn" @click="goBack">←</div>
            <div class="header-title">合集详情</div>
            <div style="width: 40px;"></div>
        </div>
        
        <div v-if="loading" class="loading-overlay">
            <div class="loading-spinner"></div>
        </div>
        
        <div v-else>
            <div class="collection-info">
                <div class="collection-icon">📚</div>
                <div class="collection-name">{{ collection.title || '未命名合集' }}</div>
                <div class="collection-meta">
                    <div class="meta-item">📋 <span>{{ cards.length }}</span> 张卡片</div>
                    <div class="meta-item" v-if="collection.isPublic !== undefined">{{ collection.isPublic ? '🌐 公开' : '🔒 私密' }}</div>
                </div>
            </div>
            
            <div class="cards-section">
                <div class="section-title">包含卡片</div>
                
                <div v-if="cards.length === 0" class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-text">合集中还没有卡片</div>
                </div>
                
                <div v-else class="cards-list">
                    <div class="card-item" v-for="card in cards" :key="card.id || card.uuid" @click="openCardDetail(card)">
                        <div class="card-header">
                            <div class="card-thumbnail" v-if="getFirstImage(card)">
                                <img :src="getFirstImage(card).startsWith('http') ? getFirstImage(card) : NGROK_URL + getFirstImage(card)" />
                            </div>
                            <div class="card-thumbnail" v-else>📄</div>
                            <div class="card-content">
                                <div class="card-title">{{ card.title }}</div>
                                <div class="card-desc">{{ card.textContent || '暂无描述' }}</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
    <script src="common.js"></script>
    
    <script>
        const { createApp, ref, onMounted } = Vue;
        
        const app = createApp({
            setup() {
                const collection = ref({});
                const cards = ref([]);
                const loading = ref(true);
                
                const collectionId = new URLSearchParams(window.location.search).get('id');
                
                const getFirstImage = (card) => {
                    if (!card.imageUrls) return null;
                    try {
                        const images = JSON.parse(card.imageUrls);
                        return images.length > 0 ? images[0] : null;
                    } catch { return null; }
                };
                
                const fetchCollection = async () => {
                    try {
                        const res = await fetch(`${BASE_URL}/collection/${collectionId}`);
                        const data = await res.json();
                        if (data.code === 200) {
                            collection.value = data.data;
                        }
                    } catch (e) { console.error(e); }
                };
                
                const fetchCollectionCards = async () => {
                    try {
                        const res = await fetch(`${BASE_URL}/collection/${collectionId}/cards`);
                        const data = await res.json();
                        if (data.code === 200) {
                            cards.value = data.data;
                        }
                    } catch (e) { console.error(e); }
                };
                
                const goBack = () => {
                    window.close();
                };
                
                const openCardDetail = (card) => {
                    window.open(`card-detail.html?uuid=${card.uuid}`, '_blank');
                };
                
                onMounted(async () => {
                    loading.value = true;
                    await Promise.all([fetchCollection(), fetchCollectionCards()]);
                    loading.value = false;
                });
                
                return { collection, cards, loading, getFirstImage, goBack, openCardDetail };
            }
        });
        
        app.use(vant);
        app.mount('#app');
    </script>
</body>
</html>
