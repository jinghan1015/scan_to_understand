<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视听图文</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: white; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow-x: hidden; }
        
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(107, 114, 128, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(107, 114, 128, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }
        
        .glow-orbs {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        .floating-item {
            position: absolute;
            font-size: 24px;
            animation: floatItem 8s ease-in-out infinite;
            opacity: 0.6;
        }
        #tech-bg{position:fixed;top:0;left:0;z-index:0;}
        .floating-item:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; font-size: 20px; }
        .floating-item:nth-child(2) { top: 25%; right: 15%; animation-delay: -1s; font-size: 28px; }
        .floating-item:nth-child(3) { top: 60%; left: 20%; animation-delay: -2s; font-size: 22px; }
        .floating-item:nth-child(4) { top: 70%; right: 10%; animation-delay: -3s; font-size: 26px; }
        .floating-item:nth-child(5) { top: 40%; left: 5%; animation-delay: -4s; font-size: 24px; }
        .floating-item:nth-child(6) { top: 85%; right: 25%; animation-delay: -5s; font-size: 20px; }
        
        @keyframes floatItem {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.6; }
            25% { transform: translateY(-20px) rotate(15deg) scale(1.1); opacity: 0.8; }
            50% { transform: translateY(-10px) rotate(-10deg) scale(1.2); opacity: 0.9; }
            75% { transform: translateY(-25px) rotate(5deg) scale(1.1); opacity: 0.7; }
        }
        .page-container { position: relative; z-index: 2; min-height: 100vh; padding-bottom: 100px; }
        .header { display: flex; align-items: center; padding: 12px 15px; background: linear-gradient(135deg, rgba(147,197,253,0.8) 0%, rgba(191,219,254,0.9) 100%); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(59,130,246,0.1); position: sticky; top: 0; z-index: 100; gap: 15px; }
        .back-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.8); border: 1px solid rgba(59,130,246,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #1e3a8a; font-size: 18px; cursor: pointer; transition: all 0.3s ease; }
        .back-btn:hover { background: rgba(96, 165, 250, 0.2); border-color: rgba(96, 165, 250, 0.4); }
        .header-title { font-size: 18px; font-weight: 600; color: #1e3a8a; letter-spacing: 2px; }
        
        .ai-assist-btn { padding: 8px 16px; background: linear-gradient(135deg, rgba(96, 165, 250, 0.2), rgba(147, 197, 253, 0.2)); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 8px; color: #60a5fa; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.3s ease; }
        .ai-assist-btn:hover { background: linear-gradient(135deg, rgba(96, 165, 250, 0.3), rgba(147, 197, 253, 0.3)); border-color: #60a5fa; }
        
        .ai-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); display: flex; align-items: flex-end; justify-content: center; z-index: 1000; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .ai-modal-content { background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%); border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; padding: 30px; padding-bottom: 60px; animation: slideUp 0.3s ease; border: 1px solid rgba(96, 165, 250, 0.2); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .ai-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
        .ai-modal-title { font-size: 20px; font-weight: 600; color: #1e3a8a; display: flex; align-items: center; gap: 10px; }
        .ai-modal-close { width: 36px; height: 36px; background: rgba(96, 165, 250, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #4b5563; font-size: 22px; cursor: pointer; transition: all 0.3s ease; }
        .ai-modal-close:hover { background: rgba(255, 100, 100, 0.2); color: #ff6464; }
        .ai-textarea { width: 100%; min-height: 120px; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 12px; padding: 15px; color: #1e3a8a; font-size: 15px; resize: none; outline: none; transition: all 0.3s ease; }
        .ai-textarea:focus { border-color: #60a5fa; box-shadow: 0 0 20px rgba(96, 165, 250, 0.2); }
        .ai-textarea::placeholder { color: rgba(75, 85, 99, 0.4); }
        .ai-submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #60a5fa 0%, #93c5fd 100%); border: none; border-radius: 12px; color: #1e3a8a; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(96, 165, 250, 0.3); }
        .ai-submit-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(96, 165, 250, 0.4); }
        .ai-submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .ai-result { margin-top: 20px; padding: 20px; background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 12px; animation: fadeIn 0.3s ease; }
        .ai-result-title { font-size: 14px; color: #60a5fa; margin-bottom: 12px; font-weight: 600; }
        .ai-result-content { font-size: 14px; color: #1e3a8a; line-height: 1.7; white-space: pre-wrap; }
        .ai-use-btn { margin-top: 15px; padding: 12px; width: 100%; background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 10px; color: #60a5fa; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .ai-use-btn:hover { background: rgba(96, 165, 250, 0.2); }

        .form-container { padding: 0 15px; }
        .form-card { background: linear-gradient(135deg, rgba(147,197,253,0.2) 0%, rgba(191,219,254,0.3) 100%); border: 1px solid rgba(59,130,246,0.2); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        .section-label { color: #1e3a8a; font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; letter-spacing: 1px; }
        .section-label .icon { font-size: 18px; }
        .form-input { width: 100%; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 12px; padding: 14px 18px; color: #1e3a8a; font-size: 16px; transition: all 0.3s ease; outline: none; }
        .form-input:focus { border-color: #60a5fa; box-shadow: 0 0 20px rgba(96, 165, 250, 0.2); background: rgba(255, 255, 255, 0.9); }
        .form-input::placeholder { color: rgba(75, 85, 99, 0.4); }
        textarea.form-input { min-height: 120px; resize: vertical; line-height: 1.6; }
        .file-upload-area { background: rgba(96, 165, 250, 0.1); border: 2px dashed rgba(96, 165, 250, 0.3); border-radius: 16px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.3s ease; }
        .file-upload-area:hover { border-color: #60a5fa; background: rgba(96, 165, 250, 0.15); }
        .file-upload-icon { font-size: 40px; margin-bottom: 10px; }
        .file-upload-text { color: #4b5563; font-size: 14px; }
        .file-upload-text span { color: #60a5fa; }

        .audio-recorder { background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 16px; padding: 25px; text-align: center; }
        .recorder-display { height: 80px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        .recorder-icon { font-size: 50px; opacity: 0.7; }
        .recorder-wave { display: flex; align-items: center; gap: 4px; height: 60px; }
        .wave-bar { width: 6px; background: linear-gradient(180deg, #60a5fa, #93c5fd); border-radius: 3px; animation: wave 0.8s ease-in-out infinite; }
        @keyframes wave { 0%,100% { height: 15px; } 50% { height: 50px; } }
        .recorder-status { margin-bottom: 20px; }
        .recording-text { color: #ff6b6b; font-size: 16px; font-weight: 600; animation: blink 1s ease-in-out infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .recorded-text { color: #60a5fa; font-size: 14px; }
        .hint-text { color: #4b5563; font-size: 14px; }
        .recorder-controls { display: flex; gap: 12px; justify-content: center; }
        .record-btn { padding: 12px 28px; background: linear-gradient(135deg, #ff6b6b, #ee5a5a); border: none; border-radius: 10px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4); }
        .record-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5); }
        .record-btn.recording { background: linear-gradient(135deg, #ff4757, #ff3747); animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .play-btn { padding: 12px 24px; background: rgba(96, 165, 250, 0.2); border: 1px solid rgba(96, 165, 250, 0.5); border-radius: 10px; color: #60a5fa; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .play-btn:hover { background: rgba(96, 165, 250, 0.3); }
        .clear-btn { padding: 12px 24px; background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.2); border-radius: 10px; color: #4b5563; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .clear-btn:hover { background: rgba(255, 100, 100, 0.2); border-color: rgba(255, 100, 100, 0.5); color: #ff6464; }

        .preview-area { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px; }
        .preview-item { width: 80px; height: 80px; background: rgba(96, 165, 250, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(96, 165, 250, 0.2); position: relative; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
        .preview-name { position: absolute; bottom: -20px; font-size: 10px; color: #4b5563; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; }

        .media-preview { margin-top: 15px; }
        .media-item { background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 12px; padding: 15px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .media-icon { font-size: 24px; }
        .media-info { flex: 1; min-width: 0; }
        .media-name { color: #1e3a8a; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-size { color: #4b5563; font-size: 12px; }
        .remove-btn { width: 28px; height: 28px; background: rgba(255, 100, 100, 0.2); border: none; border-radius: 50%; color: #ff6464; font-size: 16px; cursor: pointer; transition: all 0.3s ease; }
        .remove-btn:hover { background: rgba(255, 100, 100, 0.4); }

        .submit-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #60a5fa 0%, #93c5fd 50%, #bfdbfe 100%); border: 1px solid rgba(59,130,246,0.3); border-radius: 16px; color: #1e3a8a; font-size: 18px; font-weight: 600; letter-spacing: 4px; cursor: pointer; }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 20px 50px rgba(96, 165, 250, 0.4); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        .privacy-section { margin-top: 20px; }
        .privacy-label { color: #4b5563; font-size: 14px; margin-bottom: 12px; display: block; letter-spacing: 1px; }
        .privacy-buttons { display: flex; gap: 15px; }
        .privacy-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; border: 1px solid rgba(96, 165, 250, 0.2); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .privacy-btn.private { background: rgba(96, 165, 250, 0.1); color: #4b5563; }
        .privacy-btn.private.active { background: rgba(147, 197, 253, 0.3); border-color: rgba(96, 165, 250, 0.5); color: #1e3a8a; }
        .privacy-btn.public { background: rgba(96, 165, 250, 0.1); color: #4b5563; }
        .privacy-btn.public.active { background: rgba(147, 197, 253, 0.3); border-color: rgba(96, 165, 250, 0.5); color: #1e3a8a; }
        .privacy-btn:hover { border-color: rgba(96, 165, 250, 0.4); }
        .privacy-icon { font-size: 18px; }

        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .loading-spinner { width: 50px; height: 50px; border: 3px solid rgba(96, 165, 250, 0.2); border-top-color: #60a5fa; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .qr-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .qr-modal-content { background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 24px; width: 100%; max-width: 360px; overflow: hidden; box-shadow: 0 25px 50px rgba(96, 165, 250, 0.3); }
        .qr-header { padding: 25px; text-align: center; border-bottom: 1px solid rgba(96, 165, 250, 0.2); }
        .qr-title { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #60a5fa, #93c5fd); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .qr-body { padding: 25px; text-align: center; }
        .qr-card-info { margin-bottom: 20px; }
        .qr-card-title { color: #1e3a8a; font-size: 18px; font-weight: 600; }
        .qr-label { color: #4b5563; font-size: 14px; margin-bottom: 15px; }
        .qr-image-wrapper { background: white; padding: 15px; border-radius: 16px; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(96, 165, 250, 0.3); }
        .qr-image { width: 180px; height: 180px; display: block; }
        .qr-tip { color: #4b5563; font-size: 12px; margin-bottom: 20px; }
        .qr-share-section { text-align: left; }
        .qr-link-label { color: #4b5563; font-size: 13px; margin-bottom: 8px; }
        .qr-link-box { display: flex; gap: 10px; }
        .qr-link-input { flex: 1; background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 10px; padding: 12px 15px; color: #1e3a8a; font-size: 12px; outline: none; }
        .copy-btn { padding: 12px 20px; background: linear-gradient(135deg, #60a5fa 0%, #93c5fd 100%); border: none; border-radius: 10px; color: #1e3a8a; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .copy-btn:active { transform: scale(0.95); }
        .qr-footer { padding: 20px 25px; display: flex; gap: 12px; border-top: 1px solid rgba(96, 165, 250, 0.2); }
        .qr-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
        .qr-btn.primary { background: linear-gradient(135deg, #60a5fa 0%, #93c5fd 100%); border: none; color: #1e3a8a; box-shadow: 0 10px 30px rgba(96, 165, 250, 0.3); }
        .qr-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(96, 165, 250, 0.4); }
        .qr-btn.secondary { background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.3); color: #1e3a8a; }
        .qr-btn.secondary:hover { background: rgba(96, 165, 250, 0.2); border-color: rgba(96, 165, 250, 0.4); }
    </style>
</head>

<body>
    <canvas id="tech-bg"></canvas>
    <div class="grid-overlay"></div>
    <div class="glow-orbs">
        <div class="floating-item">✨</div>
        <div class="floating-item">🌸</div>
        <div class="floating-item">⭐</div>
        <div class="floating-item">🌼</div>
        <div class="floating-item">✨</div>
        <div class="floating-item">🌺</div>
    </div>
    <div id="app" class="page-container">
        <div class="header">
            <div class="back-btn" @click="goBack">←</div>
            <div class="header-title">{{ isEdit ? '编辑卡片' : '视听图文' }}</div>
            <button class="ai-assist-btn" @click="openAIModal">
                <svg width="18" height="18" viewBox="0 0 48 48" fill="#00d4ff">
                    <ellipse cx="24" cy="12" rx="7" ry="7"/><rect x="21" y="19" width="6" height="4"/><ellipse cx="24" cy="32" rx="14" ry="12"/><ellipse cx="18" cy="30" rx="3" ry="3"/><ellipse cx="30" cy="30" rx="3" ry="3"/><rect x="6" y="26" width="3" height="8" rx="1.5"/><rect x="39" y="26" width="3" height="8" rx="1.5"/>
                </svg>
                <span>AI辅助</span>
            </button>
        </div>

        <div class="form-container">
            <div class="form-card">
                <div class="section-label"><span>📝</span><span>标题</span></div>
                <input class="form-input" v-model="title" type="text" placeholder="请输入卡片标题" />
                
                <div class="section-label"><span>📝</span><span>文字介绍</span></div>
                <textarea class="form-input" v-model="textContent" placeholder="请输入文字说明" rows="4"></textarea>
            </div>

            <div class="form-card">
                <div class="section-label"><span>🖼️</span><span>上传图片</span></div>
                <div class="file-upload-area" @click="triggerImageUpload">
                    <div class="file-upload-icon">📷</div>
                    <div class="file-upload-text">点击上传图片 <span>(可多选)</span></div>
                </div>
                <input type="file" ref="imageInput" class="file-input" accept="image/*" multiple @change="onImagesChange" />
                <div class="preview-area" v-if="imageFiles.length > 0">
                    <div class="preview-item" v-for="(img, idx) in imageFiles" :key="idx">
                        <img :src="getImagePreview(img)" alt="预览" />
                    </div>
                </div>

                <div class="section-label"><span>🎬</span><span>上传视频</span></div>
                <div class="file-upload-area" @click="triggerVideoUpload">
                    <div class="file-upload-icon">🎥</div>
                    <div class="file-upload-text">点击上传视频</div>
                </div>
                <input type="file" ref="videoInput" class="file-input" accept="video/*" @change="onVideoChange" />

                <div class="section-label"><span>🎙️</span><span>录音</span></div>
                <div class="audio-recorder">
                    <div class="recorder-display">
                        <div class="recorder-wave" v-if="isRecording">
                            <span class="wave-bar" v-for="i in 8" :key="i" :style="{ animationDelay: i*0.1+'s' }"></span>
                        </div>
                        <div v-else>🎤</div>
                    </div>
                    <div>
                        <span v-if="isRecording" class="recording-text">录音中... {{ formatDuration(recordingDuration) }}</span>
                        <span v-else-if="audioFile" class="recorded-text">已录制 {{ formatDuration(recordingDuration) }}</span>
                        <span v-else class="hint-text">点击下方按钮开始录音</span>
                    </div>
                    <div class="recorder-controls">
                        <button class="record-btn" :class="{ recording: isRecording }" @click="toggleRecording">
                            <span v-if="!isRecording">开始录音</span>
                            <span v-else>结束录音</span>
                        </button>
                        <button class="play-btn" v-if="audioFile && !isRecording" @click="playAudio">播放</button>
                        <button class="clear-btn" v-if="audioFile && !isRecording" @click="clearAudio">清除</button>
                    </div>
                </div>

                <div class="privacy-section">
                    <div class="privacy-label">📁 卡片权限</div>
                    <div class="privacy-buttons">
                        <button class="privacy-btn private" :class="{ active: !isPublic }" @click="setPrivacy(false)">
                            <span>🔒</span><span>私密</span>
                        </button>
                        <button class="privacy-btn public" :class="{ active: isPublic }" @click="setPrivacy(true)">
                            <span>🌐</span><span>公开</span>
                        </button>
                    </div>
                </div>
            </div>

            <button class="submit-btn" @click="submitCard" :disabled="!title.trim()">
                {{ isEdit ? '✏️ 更新名片' : '✨ 创建名片' }}
            </button>
        </div>

        <div class="loading-overlay" v-if="loading"><div class="loading-spinner"></div></div>

        <div class="qr-modal" v-if="showQRModal">
            <div class="qr-modal-content">
                <div class="qr-header"><span class="qr-title">✨ 名片已创建</span></div>
                <div class="qr-body">
                    <div>{{ createdCard?.title }}</div>
                    <div class="qr-label">扫码查看名片</div>
                    <div class="qr-image-wrapper"><img :src="createdCard?.qrCodeUrl" alt="二维码" class="qr-image" /></div>
                    <button class="copy-btn" @click="copyLink">复制链接</button>
                </div>
                <div class="qr-footer">
                    <button class="qr-btn secondary" @click="goToMine">查看我的名片</button>
                    <button class="qr-btn primary" @click="closeQRModal">继续创建</button>
                </div>
            </div>
        </div>

        <div class="ai-modal-overlay" v-if="showAIModal" @click.self="closeAIModal">
            <div class="ai-modal-content">
                <div class="ai-modal-header">
                    <div class="ai-modal-title">
                        <svg width="22" height="22" viewBox="0 0 48 48" fill="#00d4ff">
                            <ellipse cx="24" cy="12" rx="7" ry="7"/><rect x="21" y="19" width="6" height="4"/><ellipse cx="24" cy="32" rx="14" ry="12"/><ellipse cx="18" cy="30" rx="3" ry="3"/><ellipse cx="30" cy="30" rx="3" ry="3"/><rect x="6" y="26" width="3" height="8" rx="1.5"/><rect x="39" y="26" width="3" height="8" rx="1.5"/>
                        </svg>
                        <span>AI 智能创作</span>
                    </div>
                    <span class="ai-modal-close" @click="closeAIModal">×</span>
                </div>
                <textarea class="ai-textarea" v-model="aiPrompt" placeholder="请描述您的名片需求"></textarea>
                <button class="ai-submit-btn" @click="generateAI" :disabled="!aiPrompt.trim() || aiLoading">
                    <span v-if="aiLoading">生成中...</span>
                    <span v-else>✨ 智能生成</span>
                </button>
                <div v-if="aiResult" class="ai-result">
                    <div class="ai-result-title">AI 生成结果</div>
                    <div class="ai-result-content">{{ aiResult }}</div>
                    <button class="ai-use-btn" @click="useAIResult">填充到内容框</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
    <script src="common.js"></script>

    <script>
        const { createApp, ref, computed } = Vue;
        const app = createApp({
            setup() {
                const title = ref('');
                const textContent = ref('');
                const imageFiles = ref([]);
                const videoFile = ref(null);
                const audioFile = ref(null);
                const loading = ref(false);
                const showQRModal = ref(false);
                const isPublic = ref(false);
                const createdCard = ref(null);
                const isEdit = ref(false);
                const showAIModal = ref(false);
                const aiPrompt = ref('');
                const aiResult = ref('');
                const aiLoading = ref(false);
                const isRecording = ref(false);
                const recordingDuration = ref(0);
                const mediaRecorder = ref(null);
                const audioChunks = ref([]);
                let recordingTimer = null;

                const userId = localStorage.getItem('userId');
                if (!userId) location.href = 'login.html';

                const cardShareUrl = computed(() => {
                    if (!createdCard.value) return '';
                    return `${NGROK_URL}/card-detail.html?uuid=${createdCard.value.uuid}`;
                });

                const goBack = () => history.back();
                const setPrivacy = (value) => isPublic.value = value;
                const triggerImageUpload = () => document.querySelector('input[type="file"][accept="image/*"]').click();
                const triggerVideoUpload = () => document.querySelector('input[type="file"][accept="video/*"]').click();

                const onImagesChange = (e) => {
                    imageFiles.value = [...imageFiles.value, ...Array.from(e.target.files)];
                };

                const onVideoChange = (e) => {
                    videoFile.value = e.target.files[0];
                };

                const getImagePreview = (file) => URL.createObjectURL(file);
                const formatDuration = (seconds) => {
                    const mins = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                };

                const toggleRecording = async () => {
                    if (isRecording.value) {
                        mediaRecorder.value.stop();
                        isRecording.value = false;
                        clearInterval(recordingTimer);
                        const audioBlob = new Blob(audioChunks.value, { type: 'audio/webm' });
                        audioFile.value = new File([audioBlob], 'recording.webm', { type: 'audio/webm' });
                    } else {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        mediaRecorder.value = new MediaRecorder(stream);
                        audioChunks.value = [];
                        recordingDuration.value = 0;
                        mediaRecorder.value.ondataavailable = (e) => {
                            if (e.data.size > 0) audioChunks.value.push(e.data);
                        };
                        mediaRecorder.value.start(1000);
                        isRecording.value = true;
                        recordingTimer = setInterval(() => recordingDuration.value++, 1000);
                    }
                };

                const playAudio = () => {
                    if (audioFile.value) {
                        const url = URL.createObjectURL(audioFile.value);
                        new Audio(url).play();
                    }
                };

                const clearAudio = () => {
                    audioFile.value = null;
                    recordingDuration.value = 0;
                };

                const submitCard = async () => {
                    if (!title.value.trim()) {
                        vant.showToast({ type: 'fail', message: '请输入标题' });
                        return;
                    }
                    
                    try {
                        const checkRes = await fetch(`${BASE_URL}/card/check-duplicate?userId=${userId}&title=${encodeURIComponent(title.value)}`);
                        const checkData = await checkRes.json();
                        if (checkData.code === 200 && checkData.data.exists) {
                            vant.showToast({ type: 'fail', message: '您已创建过相同标题的卡片' });
                            return;
                        }
                    } catch (e) {
                        console.error('检查重复失败:', e);
                    }
                    
                    loading.value = true;
                    const formData = new FormData();
                    formData.append('userId', userId);
                    formData.append('title', title.value);
                    formData.append('textContent', textContent.value);
                    formData.append('isPublic', isPublic.value ? 'true' : 'false');
                    imageFiles.value.forEach(f => formData.append('images', f));
                    if (videoFile.value) formData.append('video', videoFile.value);
                    if (audioFile.value) formData.append('audio', audioFile.value);
                    
                    try {
                        const res = await fetch(`${BASE_URL}/card/create`, { method: 'POST', body: formData });
                        const data = await res.json();
                        if (data.code === 200) {
                            createdCard.value = data.data;
                            showQRModal.value = true;
                        } else {
                            vant.showToast({ type: 'fail', message: data.msg || '创建失败' });
                        }
                    } catch (e) {
                        vant.showToast({ type: 'fail', message: '网络错误' });
                    } finally {
                        loading.value = false;
                    }
                };

                const closeQRModal = () => {
                    showQRModal.value = false;
                    title.value = '';
                    textContent.value = '';
                    imageFiles.value = [];
                    videoFile.value = null;
                    audioFile.value = null;
                    createdCard.value = null;
                };

                const goToMine = () => location.href = 'mine.html';
                const copyLink = async () => {
                    try {
                        await navigator.clipboard.writeText(cardShareUrl.value);
                        vant.showToast({ type: 'success', message: '链接已复制' });
                    } catch (e) {
                        vant.showToast({ type: 'fail', message: '复制失败' });
                    }
                };

                const openAIModal = () => showAIModal.value = true;
                const closeAIModal = () => {
                    showAIModal.value = false;
                    aiPrompt.value = '';
                    aiResult.value = '';
                };

                const generateAI = async () => {
                    if (!aiPrompt.value.trim()) return;
                    aiLoading.value = true;
                    try {
                        const res = await fetch(`${BASE_URL}/ai/generate-content`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ prompt: aiPrompt.value })
                        });
                        const data = await res.json();
                        if (data.code === 200) {
                            aiResult.value = data.data;
                        } else {
                            vant.showToast({ type: 'fail', message: data.msg || '生成失败' });
                        }
                    } catch (e) {
                        vant.showToast({ type: 'fail', message: '网络错误' });
                    } finally {
                        aiLoading.value = false;
                    }
                };

                const useAIResult = () => {
                    if (aiResult.value) {
                        textContent.value = aiResult.value;
                        closeAIModal();
                    }
                };

                return {
                    title, textContent, imageFiles, videoFile, audioFile, loading, showQRModal, isPublic,
                    createdCard, isEdit, showAIModal, aiPrompt, aiResult, aiLoading, isRecording,
                    recordingDuration, cardShareUrl, goBack, setPrivacy, triggerImageUpload,
                    triggerVideoUpload, onImagesChange, onVideoChange, getImagePreview, formatDuration,
                    toggleRecording, playAudio, clearAudio, submitCard, closeQRModal, goToMine,
                    copyLink, openAIModal, closeAIModal, generateAI, useAIResult
                };
            }
        });
        app.use(vant);
        app.mount('#app');

        const canvas = document.getElementById('tech-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        const particles = [];
        const particleCount = 120;

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 212, 255, ${this.alpha})`;
                ctx.fill();
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function init() {
            resize();
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, 212, 255, ${0.15 * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (const particle of particles) {
                particle.update();
                particle.draw();
            }
            drawConnections();
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        init();
        animate();
    </script>
</body>
</html>
