<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建卡片</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0f0f1a 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .page-container {
            min-height: 100vh;
            padding-bottom: 100px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
        }

        .header-right {
            width: 40px;
        }

        .form-container {
            padding: 20px;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .form-section {
            margin-bottom: 25px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .section-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        .section-label .icon {
            font-size: 18px;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px 18px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            background: rgba(255, 255, 255, 0.12);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        textarea.form-input {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }

        .file-upload-area {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload-area:hover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }

        .file-upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .file-upload-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .file-upload-text span {
            color: #00d4ff;
        }

        .file-input {
            display: none;
        }

        .preview-area {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .preview-item {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .preview-name {
            position: absolute;
            bottom: -20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70px;
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.3);
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(0, 212, 255, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .media-preview {
            margin-top: 15px;
        }

        .media-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .media-icon {
            font-size: 24px;
        }

        .media-info {
            flex: 1;
            min-width: 0;
        }

        .media-name {
            color: #fff;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-size {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        .remove-btn {
            width: 28px;
            height: 28px;
            background: rgba(255, 100, 100, 0.2);
            border: none;
            border-radius: 50%;
            color: #ff6464;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: rgba(255, 100, 100, 0.4);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .qr-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .qr-modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .qr-header {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .qr-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .qr-body {
            padding: 25px;
            text-align: center;
        }

        .qr-card-info {
            margin-bottom: 20px;
        }

        .qr-card-title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        .qr-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .qr-image-wrapper {
            background: white;
            padding: 15px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .qr-image {
            width: 180px;
            height: 180px;
            display: block;
        }

        .qr-tip {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            margin-bottom: 20px;
        }

        .qr-share-section {
            text-align: left;
        }

        .qr-link-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .qr-link-box {
            display: flex;
            gap: 10px;
        }

        .qr-link-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 15px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            outline: none;
        }

        .copy-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .qr-footer {
            padding: 20px 25px;
            display: flex;
            gap: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .qr-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .qr-btn.primary {
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            border: none;
            color: white;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .qr-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.4);
        }

        .qr-btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
        }

        .qr-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
        }
    </style>
</head>

<body>
    <div id="app" class="page-container">
        <div class="header">
            <div class="back-btn" @click="goBack">←</div>
            <div class="header-title">新建卡片</div>
            <div class="header-right"></div>
        </div>

        <div class="form-container">
            <div class="form-card">
                <div class="form-section">
                    <div class="section-label">
                        <span class="icon">📝</span>
                        <span>标题</span>
                    </div>
                    <input class="form-input" v-model="title" type="text" placeholder="请输入卡片标题" />
                </div>

                <div class="form-section">
                    <div class="section-label">
                        <span class="icon">📝</span>
                        <span>文字介绍</span>
                    </div>
                    <textarea class="form-input" v-model="textContent" placeholder="请输入文字说明" rows="4"></textarea>
                </div>
            </div>

            <div class="form-card">
                <div class="form-section">
                    <div class="section-label">
                        <span class="icon">🖼️</span>
                        <span>上传图片</span>
                    </div>
                    <div class="file-upload-area" @click="triggerImageUpload">
                        <div class="file-upload-icon">📷</div>
                        <div class="file-upload-text">
                            点击上传图片 <span>(可多选)</span>
                        </div>
                    </div>
                    <input type="file" ref="imageInput" class="file-input" accept="image/*" multiple @change="onImagesChange" />
                    <div class="preview-area" v-if="imageFiles.length > 0">
                        <div class="preview-item" v-for="(img, idx) in imageFiles" :key="idx">
                            <img :src="getImagePreview(img)" alt="预览" />
                            <span class="preview-name">{{ img.name }}</span>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-label">
                        <span class="icon">🎬</span>
                        <span>上传视频</span>
                    </div>
                    <div class="file-upload-area" @click="triggerVideoUpload">
                        <div class="file-upload-icon">🎥</div>
                        <div class="file-upload-text">
                            点击上传视频
                        </div>
                    </div>
                    <input type="file" ref="videoInput" class="file-input" accept="video/*" @change="onVideoChange" />
                    <div class="media-preview" v-if="videoFile">
                        <div class="media-item">
                            <span class="media-icon">🎬</span>
                            <div class="media-info">
                                <div class="media-name">{{ videoFile.name }}</div>
                                <div class="media-size">{{ formatFileSize(videoFile.size) }}</div>
                            </div>
                            <button class="remove-btn" @click="removeVideo">×</button>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-label">
                        <span class="icon">🎙️</span>
                        <span>上传录音</span>
                    </div>
                    <div class="file-upload-area" @click="triggerAudioUpload">
                        <div class="file-upload-icon">🎤</div>
                        <div class="file-upload-text">
                            点击上传录音
                        </div>
                    </div>
                    <input type="file" ref="audioInput" class="file-input" accept="audio/*" @change="onAudioChange" />
                    <div class="media-preview" v-if="audioFile">
                        <div class="media-item">
                            <span class="media-icon">🎙️</span>
                            <div class="media-info">
                                <div class="media-name">{{ audioFile.name }}</div>
                                <div class="media-size">{{ formatFileSize(audioFile.size) }}</div>
                            </div>
                            <button class="remove-btn" @click="removeAudio">×</button>
                        </div>
                    </div>
                </div>
            </div>

            <button class="submit-btn" @click="createCard" :disabled="!title.trim()">
                ✨ 创建名片
            </button>
        </div>

        <div class="loading-overlay" v-if="loading">
            <div class="loading-spinner"></div>
        </div>

        <div class="qr-modal" v-if="showQRModal">
            <div class="qr-modal-content">
                <div class="qr-header">
                    <span class="qr-title">✨ 名片已创建</span>
                </div>
                <div class="qr-body">
                    <div class="qr-card-info">
                        <div class="qr-card-title">{{ createdCard?.title }}</div>
                    </div>
                    <div class="qr-label">扫码查看名片</div>
                    <div class="qr-image-wrapper">
                        <img :src="createdCard?.qrCodeUrl?.startsWith('http') ? createdCard?.qrCodeUrl : BACKEND_URL + createdCard?.qrCodeUrl" alt="二维码" class="qr-image" />
                    </div>
                    <div class="qr-tip">微信扫码或长按识别二维码</div>
                    <div class="qr-share-section">
                        <div class="qr-link-label">分享链接</div>
                        <div class="qr-link-box">
                            <input type="text" :value="cardShareUrl" readonly class="qr-link-input" />
                            <button class="copy-btn" @click="copyLink">复制</button>
                        </div>
                    </div>
                </div>
                <div class="qr-footer">
                    <button class="qr-btn secondary" @click="goToMine">查看我的名片</button>
                    <button class="qr-btn primary" @click="closeQRModal">继续创建</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
    <script src="common.js"></script>

    <script>
        const { createApp, ref, computed } = Vue;

        const app = createApp({
            setup() {
                const title = ref('');
                const textContent = ref('');
                const imageFiles = ref([]);
                const videoFile = ref(null);
                const audioFile = ref(null);
                const loading = ref(false);
                const showQRModal = ref(false);
                const createdCard = ref(null);

                const imageInput = ref(null);
                const videoInput = ref(null);
                const audioInput = ref(null);

                const userId = localStorage.getItem('userId');
                if (!userId) {
                    location.href = 'login.html';
                }

                const cardShareUrl = computed(() => {
                    if (!createdCard.value) return '';
                    return `${NGROK_URL}/card-detail.html?uuid=${createdCard.value.uuid}`;
                });

                const goBack = () => {
                    history.back();
                };

                const triggerImageUpload = () => {
                    imageInput.value.click();
                };

                const triggerVideoUpload = () => {
                    videoInput.value.click();
                };

                const triggerAudioUpload = () => {
                    audioInput.value.click();
                };

                const onImagesChange = (e) => {
                    const files = Array.from(e.target.files);
                    imageFiles.value = [...imageFiles.value, ...files];
                };

                const onVideoChange = (e) => {
                    videoFile.value = e.target.files[0];
                };

                const onAudioChange = (e) => {
                    audioFile.value = e.target.files[0];
                };

                const removeVideo = () => {
                    videoFile.value = null;
                    if (videoInput.value) videoInput.value.value = '';
                };

                const removeAudio = () => {
                    audioFile.value = null;
                    if (audioInput.value) audioInput.value.value = '';
                };

                const getImagePreview = (file) => {
                    return URL.createObjectURL(file);
                };

                const formatFileSize = (bytes) => {
                    if (bytes < 1024) return bytes + ' B';
                    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
                };

                const createCard = async () => {
                    if (!title.value.trim()) {
                        vant.Toast.fail('请输入标题');
                        return;
                    }

                    loading.value = true;

                    const formData = new FormData();
                    formData.append('userId', userId);
                    formData.append('title', title.value);
                    formData.append('textContent', textContent.value);

                    if (imageFiles.value.length > 0) {
                        for (let file of imageFiles.value) {
                            formData.append('images', file);
                        }
                    }

                    if (videoFile.value) {
                        formData.append('video', videoFile.value);
                    }

                    if (audioFile.value) {
                        formData.append('audio', audioFile.value);
                    }

                    try {
                        const res = await fetch(`${BASE_URL}/api/card/create`, {
                            method: 'POST',
                            body: formData
                        });
                        const data = await res.json();
                        if (data.code === 200) {
                            createdCard.value = data.data;
                            showQRModal.value = true;
                        } else {
                            vant.Toast.fail(data.msg || '创建失败');
                        }
                    } catch (e) {
                        vant.Toast.fail('网络错误，请检查后端是否启动');
                    } finally {
                        loading.value = false;
                    }
                };

                const closeQRModal = () => {
                    showQRModal.value = false;
                    title.value = '';
                    textContent.value = '';
                    imageFiles.value = [];
                    videoFile.value = null;
                    audioFile.value = null;
                    createdCard.value = null;
                };

                const goToMine = () => {
                    location.href = 'mine.html';
                };

                const copyLink = async () => {
                    try {
                        await navigator.clipboard.writeText(cardShareUrl.value);
                        vant.Toast.success('链接已复制');
                    } catch (e) {
                        vant.Toast.fail('复制失败');
                    }
                };

                return {
                    title,
                    textContent,
                    imageFiles,
                    videoFile,
                    audioFile,
                    loading,
                    showQRModal,
                    createdCard,
                    cardShareUrl,
                    NGROK_URL,
                    imageInput,
                    videoInput,
                    audioInput,
                    goBack,
                    triggerImageUpload,
                    triggerVideoUpload,
                    triggerAudioUpload,
                    onImagesChange,
                    onVideoChange,
                    onAudioChange,
                    removeVideo,
                    removeAudio,
                    getImagePreview,
                    formatFileSize,
                    createCard,
                    closeQRModal,
                    goToMine,
                    copyLink
                };
            }
        });

        app.use(vant);
        app.mount('#app');
    </script>
</body>

</html>
