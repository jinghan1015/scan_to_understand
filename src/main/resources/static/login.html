<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>码上明晓 - 登录</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: white;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .glow-orbs {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-item {
            position: absolute;
            font-size: 24px;
            animation: floatItem 8s ease-in-out infinite;
            opacity: 0.6;
        }

        .floating-item:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; font-size: 20px; }
        .floating-item:nth-child(2) { top: 25%; right: 15%; animation-delay: -1s; font-size: 28px; }
        .floating-item:nth-child(3) { top: 60%; left: 20%; animation-delay: -2s; font-size: 22px; }
        .floating-item:nth-child(4) { top: 70%; right: 10%; animation-delay: -3s; font-size: 26px; }
        .floating-item:nth-child(5) { top: 40%; left: 5%; animation-delay: -4s; font-size: 24px; }
        .floating-item:nth-child(6) { top: 85%; right: 25%; animation-delay: -5s; font-size: 20px; }

        @keyframes floatItem {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.6; }
            25% { transform: translateY(-20px) rotate(15deg) scale(1.1); opacity: 0.8; }
            50% { transform: translateY(-10px) rotate(-10deg) scale(1.2); opacity: 0.9; }
            75% { transform: translateY(-25px) rotate(5deg) scale(1.1); opacity: 0.7; }
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
        }

        .login-card {
            background: linear-gradient(135deg, rgba(147,197,253,0.2) 0%, rgba(191,219,254,0.3) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 10px 40px rgba(59,130,246,0.15);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #60a5fa, #93c5fd, transparent);
        }

        .back-btn {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #60a5fa 0%, #93c5fd 100%);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e3a8a;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 32px;
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            border-color: rgba(59,130,246,0.4);
            color: #1e3a8a;
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #60a5fa 0%, #93c5fd 50%, #7c3aed 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(59,130,246,0.3);
            margin: 0 auto 28px;
        }

        .logo::before {
            content: '';
            width: 24px;
            height: 24px;
            border: 2px solid #1e3a8a;
            transform: rotate(45deg);
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 14px;
            color: #4b5563;
            text-align: center;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: #4b5563;
            margin-bottom: 10px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 12px;
            color: #1e3a8a;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .form-input:focus {
            border-color: rgba(59,130,246,0.5);
            background: white;
            box-shadow: 0 0 20px rgba(59,130,246,0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            margin-top: 12px;
            background: linear-gradient(135deg, #60a5fa 0%, #93c5fd 50%, #7c3aed 100%);
            border: none;
            border-radius: 14px;
            color: #1e3a8a;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 40px rgba(59,130,246,0.3);
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 60px rgba(59,130,246,0.4);
        }

        .submit-btn:active {
            transform: translateY(0px) scale(0.98);
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: scale(0);
        }

        .submit-btn:active::after {
            animation: ripple 0.4s ease-out;
        }

        @keyframes ripple {
            from { transform: scale(0); opacity: 1; }
            to { transform: scale(60); opacity: 0; }
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .switch-link {
            text-align: center;
            margin-top: 28px;
        }

        .switch-link-text {
            color: #4b5563;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            display: inline-block;
        }

        .switch-link-text:hover {
            color: #3b82f6;
            transform: translateY(-1px);
        }

        .switch-link-text span {
            color: #3b82f6;
            font-weight: 600;
            margin-left: 6px;
        }

        /* 响应式布局 */
        @media (max-width: 480px) {
            .login-container {
                padding: 20px 16px;
            }

            .login-card {
                padding: 30px 24px;
            }

            .logo {
                width: 60px;
                height: 60px;
                margin-bottom: 24px;
            }

            .logo::before {
                width: 20px;
                height: 20px;
            }

            .title {
                font-size: 24px;
            }

            .subtitle {
                font-size: 13px;
                margin-bottom: 32px;
            }

            .form-input {
                padding: 14px 16px;
                font-size: 14px;
            }

            .submit-btn {
                padding: 16px;
                font-size: 15px;
            }
        }

        @media (max-height: 640px) and (orientation: landscape) {
            .login-container {
                padding: 16px;
            }

            .login-card {
                padding: 24px 20px;
            }

            .logo {
                width: 50px;
                height: 50px;
                margin-bottom: 16px;
            }

            .title {
                font-size: 22px;
                margin-bottom: 4px;
            }

            .subtitle {
                margin-bottom: 24px;
            }

            .form-group {
                margin-bottom: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="grid-overlay"></div>
    <div class="glow-orbs">
        <div class="floating-item">✨</div>
        <div class="floating-item">🌸</div>
        <div class="floating-item">⭐</div>
        <div class="floating-item">🌼</div>
        <div class="floating-item">✨</div>
        <div class="floating-item">🌺</div>
    </div>

    <div class="login-container" id="app">
        <div class="login-card">
            <div class="back-btn" @click="goBack">←</div>
            <div class="logo"></div>
            <h2 class="title">登录</h2>
            <p class="subtitle">欢迎回来</p>

            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" class="form-input" v-model="username" placeholder="请输入用户名" />
            </div>

            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" v-model="password" placeholder="请输入密码" />
            </div>

            <button class="submit-btn" @click="handleLogin" :disabled="loading">
                {{ loading ? '登录中...' : '登录' }}
            </button>

            <div class="switch-link">
                <span class="switch-link-text" @click="goToRegister">
                    还没有账号？<span>立即注册</span>
                </span>
            </div>
        </div>
    </div>

    <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
    <script src="common.js"></script>

    <script>
        const { createApp, ref } = Vue;
        const app = createApp({
            setup() {
                const username = ref('');
                const password = ref('');
                const loading = ref(false);

                const goBack = () => {
                    window.location.href = 'index.html';
                };

                const handleLogin = async () => {
                    if (!username.value.trim()) {
                        vant.Toast.fail('请输入用户名');
                        return;
                    }
                    if (!password.value) {
                        vant.Toast.fail('请输入密码');
                        return;
                    }

                    loading.value = true;
                    try {
                        const response = await fetch(`${BASE_URL}/user/login`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                username: username.value,
                                password: password.value
                            })
                        });

                        const result = await response.json();
                        if (response.ok && result.code === 200) {
                            localStorage.setItem('userId', result.data.userId);
                            localStorage.setItem('username', result.data.nickname);
                            window.location.replace('index.html');
                        } else {
                            vant.Toast.fail(result.msg || '登录失败');
                        }
                    } catch (error) {
                        vant.Toast.fail('网络错误，请稍后重试');
                    } finally {
                        loading.value = false;
                    }
                };

                const goToRegister = () => {
                    window.location.href = 'register.html';
                };

                return { username, password, loading, goBack, handleLogin, goToRegister };
            }
        });
        app.use(vant);
        app.mount('#app');
    </script>
</body>

</html>
