<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易文字</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: white; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow-x: hidden; }
        
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(107, 114, 128, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(107, 114, 128, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }
        
        .glow-orbs {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        
        .floating-item {
            position: absolute;
            font-size: 24px;
            animation: floatItem 8s ease-in-out infinite;
            opacity: 0.6;
        }
        
        .floating-item:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; font-size: 20px; }
        .floating-item:nth-child(2) { top: 25%; right: 15%; animation-delay: -1s; font-size: 28px; }
        .floating-item:nth-child(3) { top: 60%; left: 20%; animation-delay: -2s; font-size: 22px; }
        .floating-item:nth-child(4) { top: 70%; right: 10%; animation-delay: -3s; font-size: 26px; }
        .floating-item:nth-child(5) { top: 40%; left: 5%; animation-delay: -4s; font-size: 24px; }
        .floating-item:nth-child(6) { top: 85%; right: 25%; animation-delay: -5s; font-size: 20px; }
        
        @keyframes floatItem {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.6; }
            25% { transform: translateY(-20px) rotate(15deg) scale(1.1); opacity: 0.8; }
            50% { transform: translateY(-10px) rotate(-10deg) scale(1.2); opacity: 0.9; }
            75% { transform: translateY(-25px) rotate(5deg) scale(1.1); opacity: 0.7; }
        }
        
        .app-container { position: relative; z-index: 2; min-height: 100vh; padding-bottom: 100px; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background: linear-gradient(135deg, rgba(147,197,253,0.8) 0%, rgba(191,219,254,0.9) 100%); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(59,130,246,0.1); position: sticky; top: 0; z-index: 100; }
        .back-btn { width: 40px; height: 40px; background: rgba(255,255,255,0.8); border: 1px solid rgba(59,130,246,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #1e3a8a; font-size: 18px; cursor: pointer; }
        .header-title { font-size: 18px; font-weight: 600; color: #1e3a8a; letter-spacing: 2px; }

        .form-container { padding: 12px 15px; }
        .form-card { background: linear-gradient(135deg, rgba(147,197,253,0.2) 0%, rgba(191,219,254,0.3) 100%); border: 1px solid rgba(59,130,246,0.2); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        .section-label { color: #1e3a8a; font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .form-input { width: 100%; background: rgba(255,255,255,0.9); border: 1px solid rgba(59,130,246,0.2); border-radius: 12px; padding: 14px 18px; color: #1e3a8a; font-size: 16px; outline: none; }
        .form-input:focus { border-color: #3b82f6; }
        .form-input::placeholder { color: #9ca3af; }
        .form-textarea { width: 100%; min-height: 200px; background: rgba(255,255,255,0.9); border: 1px solid rgba(59,130,246,0.2); border-radius: 12px; padding: 14px 18px; color: #1e3a8a; font-size: 16px; resize: none; outline: none; }
        .form-textarea:focus { border-color: #3b82f6; }
        .form-textarea::placeholder { color: #9ca3af; }

        .ai-section { background: linear-gradient(135deg, rgba(147,197,253,0.3) 0%, rgba(191,219,254,0.4) 100%); border: 1px solid rgba(59,130,246,0.2); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        .ai-label { color: #1e3a8a; font-size: 16px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .ai-textarea { width: 100%; min-height: 120px; background: rgba(255,255,255,0.9); border: 1px solid rgba(59,130,246,0.3); border-radius: 12px; padding: 15px; color: #1e3a8a; font-size: 15px; resize: none; outline: none; }
        .ai-textarea:focus { border-color: #60a5fa; }
        .ai-textarea::placeholder { color: #9ca3af; }
        .ai-submit-btn { margin-top: 15px; padding: 16px; background: linear-gradient(135deg, #60a5fa 0%, #93c5fd 50%, #bfdbfe 100%); border: 1px solid rgba(59,130,246,0.3); border-radius: 12px; color: #1e3a8a; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
        .ai-submit-btn:disabled { opacity: 0.5; }
        .ai-result { margin-top: 20px; padding: 20px; background: rgba(255,255,255,0.8); border: 1px solid rgba(59,130,246,0.2); border-radius: 12px; }
        .ai-result-title { font-size: 14px; color: #3b82f6; margin-bottom: 12px; font-weight: 600; }
        .ai-result-content { font-size: 14px; color: #1f2937; line-height: 1.7; white-space: pre-wrap; }
        .ai-use-btn { margin-top: 15px; padding: 12px; width: 100%; background: rgba(96, 165, 250, 0.1); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 10px; color: #60a5fa; font-size: 14px; font-weight: 600; cursor: pointer; }

        .submit-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #60a5fa 0%, #93c5fd 50%, #bfdbfe 100%); border: 1px solid rgba(59,130,246,0.3); border-radius: 16px; color: #1e3a8a; font-size: 18px; font-weight: 600; letter-spacing: 4px; cursor: pointer; }

        .privacy-buttons { display: flex; gap: 15px; margin-bottom: 20px; }
        .privacy-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; border: 1px solid rgba(59,130,246,0.2); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .privacy-btn.private { background: linear-gradient(135deg, rgba(147,197,253,0.2) 0%, rgba(191,219,254,0.3) 100%); color: #4b5563; }
        .privacy-btn.private.active { background: rgba(124,58,237,0.2); border-color: rgba(124,58,237,0.5); color: #7c3aed; }
        .privacy-btn.public { background: linear-gradient(135deg, rgba(147,197,253,0.2) 0%, rgba(191,219,254,0.3) 100%); color: #4b5563; }
        .privacy-btn.public.active { background: rgba(59,130,246,0.2); border-color: rgba(59,130,246,0.5); color: #3b82f6; }

        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 999; }
        .loading-spinner { width: 50px; height: 50px; border: 3px solid rgba(59,130,246,0.15); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .qr-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .qr-modal-content { background: linear-gradient(180deg, #f9fafb 0%, #f3f4f6 100%); border: 1px solid rgba(59,130,246,0.15); border-radius: 24px; width: 100%; max-width: 360px; overflow: hidden; }
        .qr-header { padding: 25px; text-align: center; border-bottom: 1px solid rgba(59,130,246,0.1); }
        .qr-title { font-size: 22px; font-weight: 700; color: #1e3a8a; }
        .qr-body { padding: 25px; text-align: center; }
        .qr-image-wrapper { background: white; padding: 15px; border-radius: 16px; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(59,130,246,0.1); }
        .qr-image { width: 180px; height: 180px; display: block; }
        .qr-footer { padding: 20px 25px; display: flex; gap: 12px; border-top: 1px solid rgba(59,130,246,0.1); }
        .qr-btn { flex: 1; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .qr-btn.primary { background: linear-gradient(135deg, #60a5fa 0%, #93c5fd 50%, #bfdbfe 100%); border: 1px solid rgba(59,130,246,0.2); color: #1e3a8a; }
        .qr-btn.secondary { background: linear-gradient(135deg, rgba(147,197,253,0.2) 0%, rgba(191,219,254,0.3) 100%); border: 1px solid rgba(59,130,246,0.2); color: #1e3a8a; }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="glow-orbs">
        <div class="floating-item">✨</div>
        <div class="floating-item">🌸</div>
        <div class="floating-item">⭐</div>
        <div class="floating-item">🌼</div>
        <div class="floating-item">✨</div>
        <div class="floating-item">🌺</div>
    </div>
    
    <div id="app" class="app-container">
        <div class="header">
            <div class="back-btn" @click="goBack">←</div>
            <div class="header-title">简易文字</div>
            <div style="width: 40px;"></div>
        </div>

        <div class="form-container">
            <div class="ai-section">
                <div class="ai-label">🤖 AI智能生成</div>
                <textarea class="ai-textarea" v-model="aiPrompt" placeholder="请输入你的需求描述，例如：帮我生成一段关于旅游攻略的文案..."></textarea>
                <button class="ai-submit-btn" :disabled="!aiPrompt.trim()" @click="generateAI">
                    {{ aiGenerating ? '生成中...' : '智能生成' }}
                </button>
                <div v-if="aiResult" class="ai-result">
                    <div class="ai-result-title">生成结果</div>
                    <div class="ai-result-content">{{ aiResult }}</div>
                    <button class="ai-use-btn" @click="fillContent">填充到内容框</button>
                </div>
            </div>

            <div class="form-card">
                <div class="section-label"><span>📝</span><span>标题</span></div>
                <input class="form-input" v-model="title" type="text" placeholder="请输入标题" />
            </div>

            <div class="form-card">
                <div class="section-label"><span>📄</span><span>内容</span></div>
                <textarea class="form-textarea" v-model="content" placeholder="请输入内容"></textarea>
            </div>

            <div class="privacy-buttons">
                <button class="privacy-btn private" :class="{ active: !isPublic }" @click="isPublic = false">
                    🔒 私密
                </button>
                <button class="privacy-btn public" :class="{ active: isPublic }" @click="isPublic = true">
                    🌐 公开
                </button>
            </div>

            <button class="submit-btn" @click="generateQRCode" :disabled="!title.trim() || !content.trim()">
                生成二维码
            </button>
        </div>

        <div v-if="showLoading" class="loading-overlay">
            <div class="loading-spinner"></div>
        </div>

        <div v-if="showQRModal" class="qr-modal">
            <div class="qr-modal-content">
                <div class="qr-header">
                    <div class="qr-title">🎉 二维码已生成</div>
                </div>
                <div class="qr-body">
                    <div class="qr-image-wrapper">
                        <img v-if="qrCodeUrl" :src="qrCodeUrl" class="qr-image" />
                    </div>
                    <p style="color: #4b5563; font-size: 14px;">扫码查看你的文字卡片</p>
                </div>
                <div class="qr-footer">
                    <button class="qr-btn secondary" @click="showQRModal = false">关闭</button>
                    <button class="qr-btn primary" @click="saveQRCode">保存图片</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
    <script src="common.js"></script>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const title = ref('');
                const content = ref('');
                const isPublic = ref(true);
                const aiPrompt = ref('');
                const aiResult = ref('');
                const aiGenerating = ref(false);
                const showLoading = ref(false);
                const showQRModal = ref(false);
                const qrCodeUrl = ref('');

                const userId = localStorage.getItem('userId');
                if (!userId) { location.href = 'login.html'; }

                const generateAI = async () => {
                    if (!aiPrompt.value.trim()) return;
                    aiGenerating.value = true;
                    try {
                        const res = await fetch(`${BASE_URL}/ai/generate-content`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ prompt: aiPrompt.value })
                        });
                        const data = await res.json();
                        if (data.code === 200) {
                            aiResult.value = data.data;
                        } else {
                            vant.showToast({ type: 'fail', message: data.msg || '生成失败' });
                        }
                    } catch (e) {
                        vant.showToast({ type: 'fail', message: '网络错误' });
                    }
                    aiGenerating.value = false;
                };

                const fillContent = () => {
                    if (!aiResult.value) return;
                    title.value = aiPrompt.value.trim();
                    content.value = aiResult.value.trim();
                    aiResult.value = '';
                    aiPrompt.value = '';
                    vant.showToast({ type: 'success', message: '已填充' });
                };

                const generateQRCode = async () => {
                    if (!title.value.trim() || !content.value.trim()) return;
                    showLoading.value = true;
                    try {
                        const formData = new FormData();
                        formData.append('userId', userId);
                        formData.append('title', title.value);
                        formData.append('textContent', content.value);
                        formData.append('isPublic', isPublic.value.toString());
                        
                        const res = await fetch(`${BASE_URL}/card/create`, {
                            method: 'POST',
                            body: formData
                        });
                        const data = await res.json();
                        if (data.code === 200) {
                            qrCodeUrl.value = data.data.qrCodeUrl.startsWith('http') ? data.data.qrCodeUrl : BACKEND_URL + data.data.qrCodeUrl;
                            showQRModal.value = true;
                        } else {
                            vant.showToast({ type: 'fail', message: data.msg || '生成失败' });
                        }
                    } catch (e) {
                        vant.showToast({ type: 'fail', message: '网络错误' });
                    }
                    showLoading.value = false;
                };

                const saveQRCode = () => {
                    if (!qrCodeUrl.value) return;
                    const link = document.createElement('a');
                    link.href = qrCodeUrl.value;
                    link.download = `qrcode_${title.value || 'text'}.png`;
                    link.click();
                };

                const goBack = () => history.back();

                return {
                    title, content, isPublic, aiPrompt, aiResult, aiGenerating,
                    showLoading, showQRModal, qrCodeUrl,
                    generateAI, fillContent, generateQRCode, saveQRCode, goBack
                };
            }
        }).use(vant).mount('#app');
    </script>
</body>
</html>
