<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }

        .glow-orbs {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-item {
            position: absolute;
            font-size: 24px;
            animation: floatItem 8s ease-in-out infinite;
            opacity: 0.6;
        }

        .floating-item:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; font-size: 20px; }
        .floating-item:nth-child(2) { top: 25%; right: 15%; animation-delay: -1s; font-size: 28px; }
        .floating-item:nth-child(3) { top: 60%; left: 20%; animation-delay: -2s; font-size: 22px; }
        .floating-item:nth-child(4) { top: 70%; right: 10%; animation-delay: -3s; font-size: 26px; }
        .floating-item:nth-child(5) { top: 40%; left: 5%; animation-delay: -4s; font-size: 24px; }
        .floating-item:nth-child(6) { top: 85%; right: 25%; animation-delay: -5s; font-size: 20px; }

        @keyframes floatItem {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.6; }
            25% { transform: translateY(-20px) rotate(15deg) scale(1.1); opacity: 0.8; }
            50% { transform: translateY(-10px) rotate(-10deg) scale(1.2); opacity: 0.9; }
            75% { transform: translateY(-25px) rotate(5deg) scale(1.1); opacity: 0.7; }
        }

        .app-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px;
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .back-btn {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
        }

        .header-right {
            width: 44px;
        }

        .scan-container {
            padding: 30px 20px;
        }

        .scan-box {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(96, 165, 250, 0.1);
        }

        .scan-video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            overflow: hidden;
        }

        .scan-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .scan-frame {
            width: 250px;
            height: 250px;
            border: 3px solid #3b82f6;
            border-radius: 16px;
            position: relative;
        }

        .scan-frame::before,
        .scan-frame::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #3b82f6;
            border-style: solid;
        }

        .scan-frame::before {
            top: -3px;
            left: -3px;
            border-width: 3px 0 0 3px;
            border-radius: 16px 0 0 0;
        }

        .scan-frame::after {
            bottom: -3px;
            right: -3px;
            border-width: 0 3px 3px 0;
            border-radius: 0 0 16px 0;
        }

        .scan-line {
            position: absolute;
            left: 20px;
            right: 20px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 20px; }
            100% { top: calc(100% - 20px); }
        }

        .scan-tip {
            text-align: center;
            color: #4b5563;
            font-size: 14px;
            margin-top: 20px;
        }

        .scan-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .scan-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-upload {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #3b82f6;
        }

        .btn-upload:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .btn-switch {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .btn-switch:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.4);
        }

        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(96, 165, 250, 0.1) 100%);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 20px;
            padding: 25px;
        }

        .result-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 15px;
        }

        .result-title {
            text-align: center;
            color: #1e3a8a;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .result-url {
            background: rgba(59, 130, 246, 0.1);
            border-radius: 12px;
            padding: 12px 15px;
            color: #1e3a8a;
            font-size: 13px;
            word-break: break-all;
            margin-bottom: 20px;
        }

        .result-actions {
            display: flex;
            gap: 12px;
        }

        .result-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-open {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            color: #fff;
        }

        .btn-open:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .btn-rescan {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #3b82f6;
        }

        .btn-rescan:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #fff;
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="glow-orbs">
        <div class="floating-item">✨</div>
        <div class="floating-item">🌸</div>
        <div class="floating-item">⭐</div>
        <div class="floating-item">🌼</div>
        <div class="floating-item">✨</div>
        <div class="floating-item">🌺</div>
    </div>

    <div id="app" class="app-container">
        <div class="header">
            <div class="back-btn" @click="goBack">←</div>
            <div class="header-title">扫码</div>
            <div class="header-right"></div>
        </div>

        <div class="scan-container">
            <div class="scan-box" v-if="!showResult">
                <div class="scan-video-wrapper">
                    <video id="video" class="scan-video" autoplay playsinline muted></video>
                    <div class="scan-overlay" v-if="scanning">
                        <div class="scan-frame">
                            <div class="scan-line"></div>
                        </div>
                    </div>
                </div>
                <p class="scan-tip">将二维码放入框内即可自动扫描</p>
                <div class="scan-actions">
                    <button class="scan-btn btn-upload" @click="uploadImage">
                        <span>📁</span>上传图片
                    </button>
                    <button class="scan-btn btn-switch" @click="switchCamera">
                        <span>🔄</span>{{ isFront ? '后置' : '前置' }}
                    </button>
                </div>
            </div>

            <div class="result-section" :class="{ show: showResult }">
                <div class="result-card">
                    <div class="result-icon">✓</div>
                    <div class="result-title">扫描成功</div>
                    <div class="result-url">{{ resultUrl }}</div>
                    <div class="result-actions">
                        <button class="result-btn btn-rescan" @click="rescan">重新扫描</button>
                        <button class="result-btn btn-open" @click="openResult">打开链接</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="common.js"></script>

    <script>
        const { createApp, ref, computed, onMounted, onUnmounted } = Vue;

        const app = createApp({
            setup() {
                let videoStream = null;
                let animationId = null;
                let canvas = null;
                let ctx = null;

                const scanning = ref(false);
                const showResult = ref(false);
                const resultUrl = ref('');
                const isFront = ref(false);

                const isUrl = computed(() => {
                    if (!resultUrl.value) return false;
                    return resultUrl.value.startsWith('http://') || 
                           resultUrl.value.startsWith('https://') ||
                           resultUrl.value.includes('.html');
                });

                onMounted(() => {
                    canvas = document.createElement('canvas');
                    ctx = canvas.getContext('2d');
                    
                    if (typeof jsQR === 'undefined') {
                        console.error('jsQR 库未加载');
                        vant.Toast.fail('扫码功能初始化失败，请刷新页面重试');
                        return;
                    }
                    
                    startScanner();
                });

                onUnmounted(() => {
                    stopScanner();
                });

                const startScanner = async () => {
                    try {
                        scanning.value = true;
                        
                        const videoElement = document.getElementById('video');
                        if (!videoElement) {
                            throw new Error('无法找到视频元素');
                        }
                        
                        const constraints = {
                            video: {
                                facingMode: isFront.value ? 'user' : 'environment',
                                width: { ideal: 640 },
                                height: { ideal: 480 },
                                focusMode: 'continuous'
                            }
                        };
                        
                        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                        videoElement.srcObject = videoStream;
                        
                        await new Promise((resolve) => {
                            videoElement.onloadedmetadata = () => {
                                resolve();
                            };
                        });
                        
                        await videoElement.play();
                        
                        console.log('视频流加载成功，分辨率:', videoElement.videoWidth, 'x', videoElement.videoHeight);
                        
                        setTimeout(() => {
                            startScanLoop();
                        }, 500);
                        
                        console.log('扫码器启动成功');
                    } catch (error) {
                        console.error('扫码器启动失败:', error);
                        if (error.name === 'NotAllowedError') {
                            vant.Toast.fail('相机权限被拒绝，请在设置中开启');
                        } else if (error.name === 'NotFoundError') {
                            vant.Toast.fail('未检测到摄像头设备');
                        } else if (error.name === 'NotSupportedError') {
                            vant.Toast.fail('浏览器不支持摄像头功能，请使用HTTPS');
                        } else {
                            vant.Toast.fail('无法启动相机: ' + error.message);
                        }
                        scanning.value = false;
                    }
                };

                const startScanLoop = () => {
                    const videoElement = document.getElementById('video');
                    if (!videoElement || !videoStream) return;
                    
                    let frameCount = 0;
                    
                    const scan = () => {
                        if (!scanning.value) return;
                        
                        try {
                            const vWidth = videoElement.videoWidth || 640;
                            const vHeight = videoElement.videoHeight || 480;
                            
                            canvas.width = vWidth;
                            canvas.height = vHeight;
                            
                            ctx.drawImage(videoElement, 0, 0, vWidth, vHeight);
                            
                            const imageData = ctx.getImageData(0, 0, vWidth, vHeight);
                            
                            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                                inversionAttempts: 'both',
                                maxNumberOfSymbols: 10
                            });
                            
                            if (code) {
                                console.log('识别到二维码:', code.data);
                                handleScanResult(code.data);
                                return;
                            }
                            
                            frameCount++;
                            if (frameCount % 30 === 0) {
                                console.log('已扫描', frameCount, '帧，未识别到二维码');
                            }
                        } catch (e) {
                            console.error('扫描帧失败:', e);
                        }
                        
                        animationId = requestAnimationFrame(scan);
                    };
                    
                    scan();
                };

                const stopScanner = () => {
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                    
                    if (videoStream) {
                        videoStream.getTracks().forEach(track => track.stop());
                        videoStream = null;
                    }
                    
                    const videoElement = document.getElementById('video');
                    if (videoElement) {
                        videoElement.srcObject = null;
                    }
                    
                    scanning.value = false;
                };

                const handleScanResult = (text) => {
                    if (!text) return;
                    
                    let url = text;
                    console.log('扫码结果:', text);
                    
                    if (text.includes('card-detail.html?')) {
                        const uuidMatch = text.match(/uuid=([^&]+)/);
                        if (uuidMatch) {
                            const uuid = uuidMatch[1];
                            url = `card-detail.html?uuid=${uuid}`;
                        } else {
                            const pathMatch = text.match(/card-detail\.html.*$/);
                            if (pathMatch) {
                                url = pathMatch[0];
                            }
                        }
                    } else if (!text.startsWith('http://') && !text.startsWith('https://')) {
                        if (text.startsWith('/')) {
                            url = window.location.origin + text;
                        } else {
                            url = text;
                        }
                    }

                    resultUrl.value = url;
                    showResult.value = true;
                    stopScanner();
                    vant.Toast.success('扫描成功');
                };

                const uploadImage = () => {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*';
                    input.onchange = async (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            await scanFromFile(file);
                        }
                    };
                    input.click();
                };

                const scanFromFile = async (file) => {
                    try {
                        vant.showLoadingToast({
                            message: '扫描中...',
                            forbidClick: true,
                            duration: 0
                        });

                        const img = new Image();
                        const url = URL.createObjectURL(file);
                        
                        await new Promise((resolve, reject) => {
                            img.onload = resolve;
                            img.onerror = reject;
                            img.src = url;
                        });
                        
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height, {
                            inversionAttempts: 'both'
                        });
                        
                        URL.revokeObjectURL(url);
                        vant.closeToast();
                        
                        if (code) {
                            handleScanResult(code.data);
                        } else {
                            vant.Toast.fail('未能识别二维码，请重试');
                        }
                    } catch (error) {
                        vant.closeToast();
                        console.error('图片扫描失败:', error);
                        vant.Toast.fail('图片处理失败，请重试');
                    }
                };

                const switchCamera = async () => {
                    isFront.value = !isFront.value;
                    stopScanner();
                    setTimeout(() => startScanner(), 100);
                };

                const rescan = async () => {
                    showResult.value = false;
                    resultUrl.value = '';
                    startScanner();
                };

                const openResult = () => {
                    if (!resultUrl.value) return;
                    
                    const isUrl = resultUrl.value.startsWith('http://') || 
                                  resultUrl.value.startsWith('https://') ||
                                  resultUrl.value.includes('.html');
                    
                    if (isUrl) {
                        if (resultUrl.value.includes('.html') && !resultUrl.value.startsWith('http')) {
                            window.location.href = resultUrl.value;
                        } else {
                            window.open(resultUrl.value, '_blank');
                        }
                    } else {
                        navigator.clipboard.writeText(resultUrl.value).then(() => {
                            vant.Toast.success('内容已复制到剪贴板');
                        }).catch(() => {
                            vant.Toast.fail('复制失败');
                        });
                    }
                };

                const goBack = () => {
                    history.back();
                };

                return {
                    scanning,
                    showResult,
                    resultUrl,
                    isFront,
                    isUrl,
                    uploadImage,
                    switchCamera,
                    rescan,
                    openResult,
                    goBack
                };
            }
        });

        app.use(vant);
        app.mount('#app');
    </script>
</body>

</html>
