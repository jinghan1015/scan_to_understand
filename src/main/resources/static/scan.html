<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: white;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(107, 114, 128, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(107, 114, 128, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        .glow-orbs {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-item {
            position: absolute;
            font-size: 24px;
            animation: floatItem 8s ease-in-out infinite;
            opacity: 0.6;
        }

        .floating-item:nth-child(1) { top: 15%; left: 10%; animation-delay: 0s; font-size: 20px; }
        .floating-item:nth-child(2) { top: 25%; right: 15%; animation-delay: -1s; font-size: 28px; }
        .floating-item:nth-child(3) { top: 60%; left: 20%; animation-delay: -2s; font-size: 22px; }
        .floating-item:nth-child(4) { top: 70%; right: 10%; animation-delay: -3s; font-size: 26px; }
        .floating-item:nth-child(5) { top: 40%; left: 5%; animation-delay: -4s; font-size: 24px; }
        .floating-item:nth-child(6) { top: 85%; right: 25%; animation-delay: -5s; font-size: 20px; }

        @keyframes floatItem {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.6; }
            25% { transform: translateY(-20px) rotate(15deg) scale(1.1); opacity: 0.8; }
            50% { transform: translateY(-10px) rotate(-10deg) scale(1.2); opacity: 0.9; }
            75% { transform: translateY(-25px) rotate(5deg) scale(1.1); opacity: 0.7; }
        }

        .orb-1 {
            display: none;
            top: -100px;
            right: -100px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #7c3aed;
            bottom: -50px;
            left: -50px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -20px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(25px, 25px) scale(1.02); }
        }

        .app-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            padding-bottom: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .back-btn {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
        }

        .header-right {
            width: 44px;
        }

        .scan-container {
            padding: 30px 20px;
        }

        .scan-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .scan-video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            overflow: hidden;
        }

        .scan-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .scan-frame {
            width: 250px;
            height: 250px;
            border: 3px solid #00d4ff;
            border-radius: 16px;
            position: relative;
        }

        .scan-frame::before,
        .scan-frame::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: #00d4ff;
            border-style: solid;
        }

        .scan-frame::before {
            top: -3px;
            left: -3px;
            border-width: 3px 0 0 3px;
            border-radius: 16px 0 0 0;
        }

        .scan-frame::after {
            bottom: -3px;
            right: -3px;
            border-width: 0 3px 3px 0;
            border-radius: 0 0 16px 0;
        }

        .scan-line {
            position: absolute;
            left: 20px;
            right: 20px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 20px; }
            100% { top: calc(100% - 20px); }
        }

        .scan-tip {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-top: 20px;
        }

        .scan-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .scan-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-upload {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-upload:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(0, 212, 255, 0.4);
        }

        .btn-switch {
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .btn-switch:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.4);
        }

        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(124, 58, 237, 0.1) 100%);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 25px;
        }

        .result-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 15px;
        }

        .result-title {
            text-align: center;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .result-url {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            word-break: break-all;
            margin-bottom: 20px;
        }

        .result-actions {
            display: flex;
            gap: 12px;
        }

        .result-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-open {
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
            color: #fff;
        }

        .btn-open:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .btn-rescan {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-rescan:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(0, 212, 255, 0.4);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="grid-overlay"></div>
    <div class="glow-orbs">
        <div class="floating-item">✨</div>
        <div class="floating-item">🌸</div>
        <div class="floating-item">⭐</div>
        <div class="floating-item">🌼</div>
        <div class="floating-item">✨</div>
        <div class="floating-item">🌺</div>
    </div>

    <div id="app" class="app-container">
        <div class="header">
            <div class="back-btn" @click="goBack">←</div>
            <div class="header-title">扫码</div>
            <div class="header-right"></div>
        </div>

        <div class="scan-container">
            <div class="scan-box" v-if="!showResult">
                <div class="scan-video-wrapper">
                    <video id="video" class="scan-video" autoplay playsinline muted></video>
                    <div class="scan-overlay" v-if="scanning">
                        <div class="scan-frame">
                            <div class="scan-line"></div>
                        </div>
                    </div>
                </div>
                <p class="scan-tip">将二维码放入框内即可自动扫描</p>
                <div class="scan-actions">
                    <button class="scan-btn btn-upload" @click="uploadImage">
                        <span>📁</span>上传图片
                    </button>
                    <button class="scan-btn btn-switch" @click="switchCamera">
                        <span>🔄</span>{{ isFront ? '后置' : '前置' }}
                    </button>
                </div>
            </div>

            <div class="result-section" :class="{ show: showResult }">
                <div class="result-card">
                    <div class="result-icon">✓</div>
                    <div class="result-title">扫描成功</div>
                    <div class="result-url">{{ resultUrl }}</div>
                    <div class="result-actions">
                        <button class="result-btn btn-rescan" @click="rescan">重新扫描</button>
                        <button class="result-btn btn-open" @click="openResult">打开链接</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="common.js"></script>

    <script>
        const { createApp, ref, onMounted, onUnmounted } = Vue;

        const app = createApp({
            setup() {
                let html5QrCode = null;
                let stream = null;

                const scanning = ref(false);
                const showResult = ref(false);
                const resultUrl = ref('');
                const isFront = ref(false);

                onMounted(() => {
                    startScanner();
                });

                onUnmounted(() => {
                    stopScanner();
                });

                const startScanner = async () => {
                    try {
                        scanning.value = true;
                        html5QrCode = new Html5Qrcode('video');
                        
                        const config = {
                            fps: 10,
                            qrbox: { width: 250, height: 250 },
                            aspectRatio: 1.0
                        };

                        await html5QrCode.start(
                            { facingMode: isFront.value ? 'user' : 'environment' },
                            config,
                            onScanSuccess,
                            onScanFailure
                        );
                    } catch (error) {
                        console.error('扫码器启动失败:', error);
                        vant.Toast.fail('无法启动相机，请检查权限设置');
                        scanning.value = false;
                    }
                };

                const stopScanner = async () => {
                    try {
                        if (html5QrCode) {
                            await html5QrCode.stop();
                            html5QrCode = null;
                        }
                    } catch (error) {
                        console.error('停止扫码器失败:', error);
                    }
                    scanning.value = false;
                };

                const onScanSuccess = (decodedText) => {
                    if (decodedText) {
                        handleScanResult(decodedText);
                    }
                };

                const onScanFailure = (error) => {
                };

                const handleScanResult = (text) => {
                    if (!text) return;
                    
                    let url = text;
                    if (!text.startsWith('http://') && !text.startsWith('https://')) {
                        if (text.includes('card-detail.html')) {
                            url = NGROK_URL + '/' + text;
                        } else if (text.startsWith('/')) {
                            url = NGROK_URL + text;
                        } else {
                            url = 'https://' + text;
                        }
                    }

                    resultUrl.value = url;
                    showResult.value = true;
                    stopScanner();
                    vant.Toast.success('扫描成功');
                };

                const uploadImage = () => {
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/*';
                    input.onchange = async (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            await scanFromFile(file);
                        }
                    };
                    input.click();
                };

                const scanFromFile = async (file) => {
                    try {
                        vant.showLoadingToast({
                            message: '扫描中...',
                            forbidClick: true,
                            duration: 0
                        });

                        const tempScanner = new Html5Qrcode('video');
                        const result = await tempScanner.scanFile(file, true);
                        
                        vant.closeToast();
                        handleScanResult(result);
                    } catch (error) {
                        vant.closeToast();
                        console.error('图片扫描失败:', error);
                        vant.Toast.fail('未能识别二维码，请重试');
                    }
                };

                const switchCamera = async () => {
                    isFront.value = !isFront.value;
                    await stopScanner();
                    await startScanner();
                };

                const rescan = async () => {
                    showResult.value = false;
                    resultUrl.value = '';
                    await startScanner();
                };

                const openResult = () => {
                    if (resultUrl.value) {
                        window.open(resultUrl.value, '_blank');
                    }
                };

                const goBack = () => {
                    history.back();
                };

                return {
                    scanning,
                    showResult,
                    resultUrl,
                    isFront,
                    uploadImage,
                    switchCamera,
                    rescan,
                    openResult,
                    goBack
                };
            }
        });

        app.use(vant);
        app.mount('#app');
    </script>
</body>

</html>
