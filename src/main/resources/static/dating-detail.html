<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交友名片</title>
    <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: linear-gradient(135deg, #fdf2f8 0%, #ede9fe 100%); font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        
        .page-container { min-height: 100vh; padding: 20px; }
        
        .card-wrapper { background: white; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(236, 72, 153, 0.15); }
        
        .card-header { background: linear-gradient(135deg, #ec4899, #a855f7); padding: 40px 30px 30px; text-align: center; position: relative; }
        .card-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
        
        .avatar { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 20px; border: 4px solid rgba(255, 255, 255, 0.5); position: relative; z-index: 1; }
        .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .avatar.default { background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1)); display: flex; align-items: center; justify-content: center; font-size: 50px; }
        
        .name { font-size: 28px; font-weight: 700; color: white; margin-bottom: 8px; position: relative; z-index: 1; }
        .gender-age { font-size: 16px; color: rgba(255, 255, 255, 0.8); position: relative; z-index: 1; }
        .signature { font-size: 14px; color: rgba(255, 255, 255, 0.9); margin-top: 15px; position: relative; z-index: 1; }
        
        .card-body { padding: 30px; }
        
        .section { margin-bottom: 25px; }
        .section-title { font-size: 15px; font-weight: 600; color: #7c3aed; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .section-icon { font-size: 18px; }
        
        .tags-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .tag-item { padding: 10px 20px; background: linear-gradient(135deg, rgba(236, 72, 153, 0.1), rgba(168, 85, 247, 0.1)); border-radius: 20px; color: #7c3aed; font-size: 14px; }
        
        .match-section { background: linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, rgba(168, 85, 247, 0.1) 100%); border-radius: 16px; padding: 25px; margin-top: 20px; text-align: center; }
        .match-title { font-size: 16px; font-weight: 600; color: #1f2937; margin-bottom: 15px; }
        .match-input { width: 100%; padding: 14px; border: 2px dashed rgba(168, 85, 247, 0.3); border-radius: 12px; text-align: center; font-size: 16px; color: #4b5563; margin-bottom: 15px; }
        .match-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #ec4899, #a855f7); border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
        
        .loading-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loading-spinner { width: 50px; height: 50px; border: 3px solid rgba(168, 85, 247, 0.2); border-top-color: #a855f7; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 15px; color: #6b7280; }
        
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { font-size: 60px; margin-bottom: 20px; }
        .empty-text { color: #6b7280; font-size: 16px; }
        
        .share-btn { position: fixed; bottom: 30px; right: 30px; width: 56px; height: 56px; background: linear-gradient(135deg, #ec4899, #a855f7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 10px 30px rgba(236, 72, 153, 0.4); cursor: pointer; }
        
        .match-result-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .match-result-content { background: white; border-radius: 24px; width: 100%; max-width: 360px; overflow: hidden; }
        .result-header { background: linear-gradient(135deg, #22c55e, #a855f7); padding: 30px; text-align: center; }
        .result-score { font-size: 48px; font-weight: 700; color: white; }
        .result-label { color: rgba(255, 255, 255, 0.9); margin-top: 5px; }
        .result-body { padding: 25px; }
        .result-relation { text-align: center; font-size: 20px; font-weight: 600; color: #1f2937; margin-bottom: 20px; }
        .result-analysis { background: rgba(168, 85, 247, 0.1); border-radius: 12px; padding: 15px; font-size: 14px; color: #4b5563; line-height: 1.6; white-space: pre-wrap; }
        .result-close { width: 100%; padding: 14px; background: linear-gradient(135deg, #ec4899, #a855f7); border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: 600; margin-top: 20px; cursor: pointer; }
    </style>
</head>

<body>
    <div id="app" class="page-container">
        <div v-if="loading" class="loading-container">
            <div class="loading-spinner"></div>
            <div class="loading-text">加载中...</div>
        </div>

        <div v-else-if="!profile" class="empty-state">
            <div class="empty-icon">👤</div>
            <div class="empty-text">未找到该交友名片</div>
        </div>

        <div v-else>
            <div class="card-wrapper">
                <div class="card-header">
                    <div class="avatar" :class="{ default: !profile.photo }">
                        <img v-if="profile.photo" :src="profile.photo.startsWith('http') ? profile.photo : NGROK_URL + profile.photo" />
                        <span v-else>👤</span>
                    </div>
                    <div class="name">{{ profile.nickname }}</div>
                    <div class="gender-age">{{ profile.gender === 'male' ? '👨 男生' : '👩 女生' }} · {{ profile.age }}岁</div>
                    <div class="signature" v-if="profile.signature">💬 {{ profile.signature }}</div>
                </div>

                <div class="card-body">
                    <div class="section">
                        <div class="section-title">
                            <span class="section-icon">🎭</span>
                            <span>性格特点</span>
                        </div>
                        <div class="tags-grid">
                            <span v-for="tag in profile.personality" :key="tag" class="tag-item">{{ tag }}</span>
                        </div>
                    </div>

                    <div class="section">
                        <div class="section-title">
                            <span class="section-icon">🎯</span>
                            <span>兴趣爱好</span>
                        </div>
                        <div class="tags-grid">
                            <span v-for="tag in profile.hobbies" :key="tag" class="tag-item">{{ tag }}</span>
                        </div>
                    </div>

                    <div class="match-section">
                        <div class="match-title">🔮 想知道你们的缘分吗？</div>
                        <input class="match-input" v-model="myCode" placeholder="输入你的匹配码" />
                        <button class="match-btn" @click="startMatch">开始匹配</button>
                    </div>
                </div>
            </div>

            <div class="share-btn" @click="shareProfile">📤</div>
        </div>

        <div v-if="showMatchResult" class="match-result-modal" @click.self="closeMatchResult">
            <div class="match-result-content">
                <div class="result-header">
                    <div class="result-score">{{ matchResult?.score }}%</div>
                    <div class="result-label">匹配度</div>
                </div>
                <div class="result-body">
                    <div class="result-relation">🌟 {{ matchResult?.relation }}</div>
                    <div class="result-analysis">{{ matchResult?.analysis }}</div>
                    <button class="result-close" @click="closeMatchResult">我知道了</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
    <script src="common.js"></script>

    <script>
        const { createApp, ref, onMounted } = Vue;
        const app = createApp({
            setup() {
                const profile = ref(null);
                const loading = ref(true);
                const myCode = ref('');
                const showMatchResult = ref(false);
                const matchResult = ref(null);

                const urlParams = new URLSearchParams(window.location.search);
                const code = urlParams.get('code');

                const loadProfile = async () => {
                    if (!code) { loading.value = false; return; }
                    try {
                        const res = await fetch(`${BASE_URL}/dating/get-by-code?code=${code}`);
                        const data = await res.json();
                        if (data.code === 200) {
                            profile.value = data.data;
                        }
                    } catch (e) {
                        console.error(e);
                    } finally {
                        loading.value = false;
                    }
                };

                const startMatch = async () => {
                    if (!myCode.value) {
                        vant.showToast({ type: 'fail', message: '请输入匹配码' });
                        return;
                    }

                    const userId = localStorage.getItem('userId');
                    if (!userId) {
                        vant.showToast({ type: 'fail', message: '请先登录' });
                        setTimeout(() => location.href = 'login.html', 1500);
                        return;
                    }

                    try {
                        const res = await fetch(`${BASE_URL}/dating/match`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId, targetCode: myCode.value })
                        });
                        const data = await res.json();
                        if (data.code === 200) {
                            matchResult.value = data.data;
                            showMatchResult.value = true;
                        } else {
                            vant.showToast({ type: 'fail', message: data.msg });
                        }
                    } catch (e) {
                        vant.showToast({ type: 'fail', message: '网络错误' });
                    }
                };

                const closeMatchResult = () => {
                    showMatchResult.value = false;
                };

                const shareProfile = () => {
                    vant.showToast({ type: 'none', message: '链接已复制' });
                    navigator.clipboard.writeText(window.location.href);
                };

                onMounted(() => {
                    loadProfile();
                });

                return {
                    profile,
                    loading,
                    myCode,
                    showMatchResult,
                    matchResult,
                    startMatch,
                    closeMatchResult,
                    shareProfile
                };
            }
        });
        app.use(vant);
        app.mount('#app');
    </script>
</body>
</html>
